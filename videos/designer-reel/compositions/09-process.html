<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- F9 "How I work" (film 1080-1200, 4 s). The bench scope again: the beam lies across the optical centre as the scope's
         ticked x axis under a graticule that fades upward. Continue upward in (y 300 -> 0, 9 f expo.out): the five Tier B
         beads (110 px) and their step labels ride in already on the trace, so the bed's crash hits a composed frame; the
         glass settles with one liquid wobble as the move stops (1089). A white-hot beam-core dot enters from the left and
         hard-stops in one bead per beat (1095, 1110, 1125, 1140, 1155): the bead grabs it (refraction kick, rim catches the
         light), a cyan cursor drops and the step's label lights cyan, then settles to ink-dim. Each bead keeps a persisted
         dot. The pulse fires out right (1159-1168), his line wipes on at 1170 in two halves aligned to the steps they
         describe, hold to the hard cut at 1200 (F10 owns the chroma).
         Local time = film frame - 1080. Needs window.ReelKit (assets/lib/reel-kit.js). -->
  </head>
  <body>
    <template id="f09-template">
      <style>
        @font-face { font-family: "Mona Sans"; src: url("assets/fonts/MonaSans-var.woff2") format("woff2"); font-weight: 200 900; font-stretch: 75% 125%; }
        @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-normal.woff2") format("woff2"); font-weight: 100 800; }
        #f09-root { position: absolute; inset: 0; overflow: hidden; background: #0b0716; }
        .f09-stage { position: absolute; inset: 0; }
        #f09-world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #f09-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 74% at 50% 50%, rgba(7, 4, 16, 0) 58%, rgba(7, 4, 16, 0.72) 100%); }

        /* Tier B beads (110 px): inward rim lens over the trace and the pulse; skin scaled to bead size */
        .f09-bead { position: absolute; width: 110px; height: 110px; border-radius: 55px; box-shadow: 0 24px 36px -18px rgba(7, 4, 16, 0.92); }
        .lg-tint, .lg-shade, .lg-rim { position: absolute; inset: 0; border-radius: inherit; }
        .lg-tint { background: rgba(180, 150, 255, 0.07); }
        .lg-shade { box-shadow: inset 0 2px 1px -1px rgba(255, 255, 255, 0.7), inset 0 14px 18px -13px rgba(255, 255, 255, 0.32), inset 0 -15px 22px -15px rgba(34, 230, 255, 0.28), inset 0 0 16px rgba(255, 255, 255, 0.05), inset 0 0 0 1px rgba(243, 238, 255, 0.1); }
        .lg-rim { padding: 2px; --spec: 150deg; background: conic-gradient(from var(--spec), rgba(255, 255, 255, 0.95) 0deg, rgba(255, 255, 255, 0.18) 46deg, rgba(255, 255, 255, 0) 90deg, rgba(255, 46, 151, 0.7) 168deg, rgba(255, 255, 255, 0) 214deg, rgba(34, 230, 255, 0.45) 300deg, rgba(255, 255, 255, 0.95) 360deg); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

        /* step labels: true system text, set from the cut in ink-faint; cyan while lit, then ink-dim */
        .f09-lab { position: absolute; font: 500 30px/1.3 "JetBrains Mono", monospace; letter-spacing: 0.14em; color: #8c7eb8; white-space: pre; }
        #f09-quote { position: absolute; left: 0; top: 0; width: 1200px; height: 110px; font-family: "Mona Sans", sans-serif; font-size: 80px; line-height: 1.2; font-variation-settings: "wdth" 100, "wght" 380; color: #f3eeff; white-space: nowrap; clip-path: inset(0 100% 0 0); }
        #f09-quote > span { position: absolute; left: 0; top: 0; }
        #f09-grain { position: absolute; inset: 0; opacity: 0.1; mix-blend-mode: overlay; }
      </style>

      <div id="f09-root" data-composition-id="f09" data-width="1920" data-height="1080" data-duration="4">
        <div id="f09-scene" class="clip" data-start="0" data-duration="4" data-track-index="0">
          <div class="f09-stage" id="f09-wstage"><svg id="f09-world" viewBox="0 0 1920 1080" aria-hidden="true" data-layout-allow-overflow></svg></div>
          <div id="f09-vignette" data-layout-ignore></div>
          <div class="f09-stage" id="f09-ustage">
            <div id="f09-beads"></div>
            <div id="f09-labs"></div>
            <div id="f09-quote"><span id="f09-q1">Research-led.</span><span id="f09-q2">Decision-first.</span></div>
          </div>
          <div id="f09-grain" data-layout-ignore></div>

          <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs id="f09-defs"></defs>
          </svg>
        </div>
      </div>

      <script>
        (function () {
          var K = window.ReelKit;
          var root = document.getElementById("f09-root");
          var defs = document.getElementById("f09-defs");
          var Q = function (s) { return root.querySelectorAll(s); };
          var F = function (n) { return n / 30; }; // local frame -> seconds

          // geometry. Y = 440 puts the trace at 740 on the cut, just above where F8's last run leaves the frame (821 on 1079), so the line keeps
          // rising through the cut and lands in the optical centre. Beads every 330 px; each label hangs right of its
          // cursor; the row spans the frame edge to edge (bead 0 left edge 150, last label ends 1769).
          var Y = 440, R = 55, SP = 330, BX = [205, 535, 865, 1195, 1525];
          var HIT = [15, 30, 45, 60, 75]; // 1095, 1110, 1125, 1140, 1155: the pulse hard-stops in bead i
          var STEPS = ["DISCOVER &\nFRAME", "RESEARCH &\nTEST", "DEFINE THE\nSYSTEM", "DESIGN &\nREFINE", "DELIVER &\nSUPPORT"];
          var GP = SP / 2, GX0 = BX[0] - GP / 2; // graticule pitch and x origin (every bead sits mid-division)
          var LAB_X = 24, LAB_Y = Y + R + 22, CUR_A = Y + R + 12, CUR_B = Y + R + 104, QUOTE_Y = Y + 215;

          // world: haze, graticule above the trace (fades upward), scope ticks, trace + pulse (bloom), cursors (crisp)
          var w = '<defs><radialGradient id="f09-haze-g" cx="960" cy="' + Y + '" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 ' + Y + ") scale(1150 330) translate(-960 -" + Y + ')">';
          w += '<stop offset="0" stop-color="#3b1e6e" stop-opacity="0.85"/><stop offset="0.45" stop-color="#3b1e6e" stop-opacity="0.32"/><stop offset="1" stop-color="#3b1e6e" stop-opacity="0"/></radialGradient>';
          w += '<linearGradient id="f09-grat-g" x1="0" y1="' + (Y - 640) + '" x2="0" y2="' + Y + '" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>';
          w += '<mask id="f09-grat-m" maskUnits="userSpaceOnUse" x="0" y="-400" width="1920" height="' + (Y + 400) + '"><rect x="0" y="-400" width="1920" height="' + (Y + 400) + '" fill="url(#f09-grat-g)"/></mask>';
          // bloom hugs the trace and the pulse (beam bbox + 60 px)
          w += '<filter id="f09-bloom" x="-100" y="' + (Y - 90) + '" width="2120" height="180" filterUnits="userSpaceOnUse"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1"/><feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2"/>';
          w += '<feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
          w += '<rect id="f09-haze" x="-200" y="-140" width="2320" height="1100" fill="url(#f09-haze-g)"/>';
          w += '<g mask="url(#f09-grat-m)" stroke="#4a2c8c" stroke-opacity="0.35" stroke-width="1.5">';
          for (var gx = GX0; gx < 1920; gx += GP) w += '<line x1="' + gx.toFixed(1) + '" y1="-400" x2="' + gx.toFixed(1) + '" y2="' + Y + '"/>';
          for (var gy = Y - GP; gy > -400; gy -= GP) w += '<line x1="0" y1="' + gy.toFixed(1) + '" x2="1920" y2="' + gy.toFixed(1) + '"/>';
          w += '</g><g stroke="#22e6ff" stroke-opacity="0.42" stroke-width="1.6">';
          for (var tk = -4; GX0 + (tk * GP) / 4 <= 1920; tk++) { var x = (GX0 + (tk * GP) / 4).toFixed(1), tall = tk % 4 === 0 ? 9 : 4; w += '<line x1="' + x + '" y1="' + (Y - tall) + '" x2="' + x + '" y2="' + (Y + tall) + '"/>'; }
          w += "</g>";
          // the trace (persisted beam), one persisted dot per visited bead, then the pulse: fresh tail, core tail, white head
          w += '<g filter="url(#f09-bloom)" fill="none" stroke-linecap="round">';
          w += '<path d="M -40 ' + Y + ' H 1960" stroke="#ff2e97" stroke-width="5" stroke-opacity="0.5"/>';
          w += '<path d="M -40 ' + Y + ' H 1960" stroke="#ffd9ec" stroke-width="2.2" stroke-opacity="0.5"/>';
          BX.forEach(function (bx) { w += '<path class="f09-pd" d="M ' + bx + " " + Y + ' h 0.01" stroke="#ffd9ec" stroke-width="10" opacity="0"/>'; });
          w += '<path class="f09-pt" d="M0 0" stroke="#ff2e97" stroke-width="7" stroke-opacity="0.85"/>';
          w += '<path class="f09-pc" d="M0 0" stroke="#ffd9ec" stroke-width="4"/>';
          w += '<path class="f09-ph" d="M0 0" stroke="#ffffff" stroke-width="13"/></g>';
          w += '<g stroke="#22e6ff" stroke-width="2.4" stroke-linecap="square">';
          BX.forEach(function (bx) { w += '<line class="f09-cur" x1="' + bx + '" y1="' + CUR_A + '" x2="' + bx + '" y2="' + CUR_B + '" stroke-dasharray="' + (CUR_B - CUR_A) + ' 200" stroke-dashoffset="' + (CUR_B - CUR_A) + '"/>'; });
          document.getElementById("f09-world").innerHTML = w + "</g>";

          // beads + labels
          var beads = "", labs = "";
          BX.forEach(function (bx, i) {
            beads += '<div class="f09-bead" style="left:' + (bx - R) + "px;top:" + (Y - R) + "px;backdrop-filter:url(#f09-bd-" + i + ')"><div class="lg-tint"></div><div class="lg-shade"></div><div class="lg-rim"></div></div>';
            labs += '<div class="f09-lab" style="left:' + (bx + LAB_X) + "px;top:" + LAB_Y + 'px">' + STEPS[i] + "</div>";
            defs.insertAdjacentHTML("beforeend", K.lensFilter("f09-bd-" + i, { w: 110, h: 110, r: R, bezel: 46, dir: -1, power: 1.6 }));
          });
          document.getElementById("f09-beads").innerHTML = beads;
          document.getElementById("f09-labs").innerHTML = labs;
          // his line in two halves: "Research-led." under the research steps, "Decision-first." from the decide step
          var quote = document.getElementById("f09-quote");
          quote.style.left = BX[0] - 6 + "px";
          quote.style.top = QUOTE_Y + "px";
          document.getElementById("f09-q2").style.left = BX[2] - BX[0] + "px";
          var BF = BX.map(function (_, i) { return document.getElementById("f09-bd-" + i); });
          var beadEls = Q(".f09-bead"), labEls = Q(".f09-lab"), curs = Q(".f09-cur"), dots = Q(".f09-pd");
          var tail = Q(".f09-pt")[0], core = Q(".f09-pc")[0], head = Q(".f09-ph")[0];

          function c01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
          function p2o(u) { u = c01(u); return 1 - Math.pow(1 - u, 3); } // GSAP power2.out
          function p2i(u) { u = c01(u); return u * u * u; } // power2.in
          function p2io(u) { u = c01(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(2 - 2 * u, 3) / 2; } // power2.inOut
          // pulse x as a pure function of local frame: enters fast and stops in bead 0, then per beat a 4 f hold and
          // an 11 f launch-and-stop to the next bead, then fires out right through the frame edge
          function pulseX(f) {
            if (f < 3) return -240;
            if (f < HIT[0]) return -240 + (BX[0] + 240) * p2o((f - 3) / 12);
            for (var i = 0; i < 4; i++) {
              if (f < HIT[i] + 4) return BX[i];
              if (f < HIT[i + 1]) return BX[i] + SP * p2io((f - HIT[i] - 4) / 11);
            }
            if (f < 79) return BX[4];
            return BX[4] + (2160 - BX[4]) * p2i((f - 79) / 9);
          }
          function seg(a, b) { return "M " + a.toFixed(1) + " " + Y + " H " + (b + 0.01).toFixed(1); }
          var CHIP = K.spring(0.45, 0.8, 0.7);

          // everything that depends on the pulse: the dot and its phosphor tails (they collapse onto the dot when it stops),
          // the persisted dots, bead refraction (rest 0.45 of the bead scale after one settle wobble as the move lands;
          // the beads around the pulse ramp up, a landing adds a short grab)
          function render(t) {
            var f = t * 30, x = pulseX(f), on = x > -200 && x < 2100;
            head.setAttribute("d", on ? seg(x - 3, x) : "M0 0");
            core.setAttribute("d", on ? seg(Math.min(pulseX(f - 2), x - 3), x) : "M0 0");
            tail.setAttribute("d", on ? seg(Math.min(pulseX(f - 6), x - 3), x) : "M0 0");
            for (var j = 0; j < 5; j++) dots[j].setAttribute("opacity", f < HIT[j] + 4 ? 0 : (0.6 + 0.4 * (1 - c01((f - HIT[j] - 4) / 20))).toFixed(3));
            var pos = (x - BX[0]) / SP, settle = 1 + 0.9 * (1 - CHIP(c01(t / 0.7)));
            for (var i = 0; i < 5; i++) {
              var grab = f >= HIT[i] && f < HIT[i] + 9 ? 0.2 * (1 - (f - HIT[i]) / 9) : 0;
              K.setRefraction(BF[i], 55 * (0.45 * settle + 0.2 * c01(1.5 - Math.abs(i - pos)) + grab));
            }
          }
          render(0);

          var grain = document.getElementById("f09-grain");
          grain.style.backgroundImage = K.grainURL(1337);
          var tl = gsap.timeline({ paused: true });
          var amb = { t: 0 };
          tl.to(amb, { t: 4, duration: 4, ease: "none", onUpdate: function () { render(amb.t); grain.style.backgroundPosition = K.grainPos(amb.t); } }, 0);
          tl.fromTo("#f09-haze", { opacity: 0.75 }, { opacity: 1, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

          // 1080 continue upward: both stage layers rise y 300 -> 0 in 9 f, expo.out (F8 did the out); the beads and labels
          // ride in already set, the glass rims catch the light as the move stops
          tl.fromTo(".f09-stage", { y: 300 }, { y: 0, duration: F(9), ease: "expo.out" }, 0);
          beadEls.forEach(function (b, i) {
            tl.fromTo(b.querySelector(".lg-rim"), { "--spec": 80 + 12 * i + "deg" }, { "--spec": 200 + "deg", duration: 1.0, ease: "power3.out" }, 0);
          });

          // per beat: the pulse lands in bead i -> its rim catches the light, a cyan cursor drops (step measured) and the
          // label lights cyan, settling to ink-dim a beat later
          HIT.forEach(function (h, i) {
            var t0 = F(h);
            tl.fromTo(beadEls[i].querySelector(".lg-rim"), { "--spec": "200deg" }, { "--spec": "290deg", duration: 0.4, ease: "power3.out", immediateRender: false }, t0);
            tl.fromTo(curs[i], { strokeDashoffset: CUR_B - CUR_A }, { strokeDashoffset: 0, duration: F(4), ease: "power4.out" }, t0);
            tl.set(labEls[i], { color: "#22e6ff" }, t0);
            tl.fromTo(labEls[i], { color: "#22e6ff" }, { color: "#b4a8da", duration: 0.5, ease: "power2.out", immediateRender: false }, F(h + 15));
          });

          // 1170 his line wipes on below the row; the key composition holds a beat to the cut
          tl.to("#f09-quote", { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, F(90));

          window.__timelines["f09"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
