<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- F10 "By the numbers" (film 1200-1320, 4 s). Hard cut in with a 3 f chroma split on the opening zero.
         A Tier H plate stands on the vector floor left of centre; four Doto counters roll up in it like an arcade
         score and land volt on the bed's stabs (1230, 1245, 1260, 1275). As each next count starts, the previous
         number shrinks into a score ledger on the right (digits right-aligned, labels in a column). At 1290 the
         plate glides one plate-width right along the beam and the fourth number rides it into the ledger, so the
         glass ends holding all four. 1305-1320 tape-stop: one clock (warp) slows the floor, haze, grain and the
         beam head to a freeze while the frame sags 4 px (power2.out). Hard cut at 1320.
         All type lives in the world, which is built twice (frame + inside the lens) so the glass bends it.
         Local time = film frame - 1200. Needs window.ReelKit (assets/lib/reel-kit.js). -->
  </head>
  <body>
    <template id="f10-template">
      <style>
        @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-normal.woff2") format("woff2"); font-weight: 100 800; }
        @font-face { font-family: "Doto"; src: url("assets/fonts/Doto-var.woff2") format("woff2"); font-weight: 100 900; }
        #f10-root { position: absolute; inset: 0; overflow: hidden; background: #0b0716; }
        .f10-stage { position: absolute; inset: 0; }
        .f10-world, .f10-world svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        .f10-world { background: #0b0716; }
        #f10-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 74% at 50% 50%, rgba(7, 4, 16, 0) 58%, rgba(7, 4, 16, 0.72) 100%); }

        /* counters: Doto arcade score, origin on the left baseline so the ledger move is one translate + scale */
        .f10-num { position: absolute; left: 200px; top: 335px; font: 900 300px/1 "Doto", monospace; font-variant-numeric: tabular-nums; color: #b4a8da; white-space: nowrap; transform-origin: 0% 85%; --glow: 0; text-shadow: 0 0 30px rgba(245, 255, 59, var(--glow)); opacity: 0; }
        .f10-num > span { position: absolute; left: 0; top: 0; opacity: 0; }
        .f10-num > .f10-gr { color: #ff2e97; }
        .f10-num > .f10-gc { color: #22e6ff; }
        .f10-num > strong { position: relative; display: block; font-weight: inherit; }
        .f10-lab { position: absolute; left: 204px; top: 630px; font: 500 24px/1 "JetBrains Mono", monospace; letter-spacing: 0.14em; color: #b4a8da; white-space: nowrap; }
        .f10-car { display: inline-block; width: 0.6em; height: 1em; margin-left: 4px; vertical-align: -0.14em; background: #ff2e97; opacity: 0; }

        /* Tier H plate: an outward lens over the duplicated world (floor, beam and all the type) */
        #f10-plate, #f10-shadow { position: absolute; left: 120px; top: 250px; width: 840px; height: 540px; border-radius: 56px; }
        #f10-plate { overflow: hidden; isolation: isolate; }
        #f10-shadow { box-shadow: 0 60px 90px -40px rgba(7, 4, 16, 0.95); }
        #f10-lens { position: absolute; inset: 0; filter: url(#f10-lens-f); }
        #f10-lens > .f10-world { left: -120px; top: -250px; }
        .lg-tint, .lg-shade, .lg-rim { position: absolute; inset: 0; border-radius: inherit; }
        .lg-tint { background: rgba(180, 150, 255, 0.07); }
        .lg-shade { box-shadow: inset 0 2px 1px -1px rgba(255, 255, 255, 0.7), inset 0 26px 40px -30px rgba(255, 255, 255, 0.35), inset 0 -34px 54px -34px rgba(34, 230, 255, 0.28), inset 0 0 36px rgba(255, 255, 255, 0.05), inset 0 0 0 1px rgba(243, 238, 255, 0.1); }
        .lg-rim { padding: 2px; --spec: 110deg; background: conic-gradient(from var(--spec), rgba(255, 255, 255, 0.95) 0deg, rgba(255, 255, 255, 0.18) 46deg, rgba(255, 255, 255, 0) 90deg, rgba(255, 46, 151, 0.7) 168deg, rgba(255, 255, 255, 0) 214deg, rgba(34, 230, 255, 0.45) 300deg, rgba(255, 255, 255, 0.95) 360deg); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        .f10-skin { opacity: 0; }
        #f10-grain { position: absolute; inset: 0; opacity: 0.1; mix-blend-mode: overlay; }
      </style>

      <div id="f10-root" data-composition-id="f10" data-width="1920" data-height="1080" data-duration="4">
        <div id="f10-scene" class="clip" data-start="0" data-duration="4" data-track-index="0">
          <div class="f10-stage" id="f10-wstage"><div class="f10-world" id="f10-world-main" data-layout-allow-overflow data-layout-allow-occlusion></div></div>
          <div id="f10-vignette" data-layout-ignore></div>
          <div class="f10-stage" id="f10-gstage">
            <div id="f10-shadow" class="f10-skin"></div>
            <div id="f10-plate">
              <div id="f10-lens"><div class="f10-world" id="f10-world-lens" data-layout-ignore></div></div>
              <div class="lg-tint f10-skin"></div>
              <div class="lg-shade f10-skin"></div>
              <div class="lg-rim f10-skin" id="f10-rim"></div>
            </div>
          </div>
          <div id="f10-grain" data-layout-ignore></div>

          <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs id="f10-defs">
              <!-- one bloom for both world copies: it hugs the rail beam (bbox + 60 px) -->
              <filter id="f10-bloom" x="-100" y="750" width="2120" height="140" filterUnits="userSpaceOnUse">
                <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1" /><feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2" />
                <feMerge><feMergeNode in="b2" /><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
            </defs>
          </svg>
        </div>
      </div>

      <script>
        (function () {
          var K = window.ReelKit;
          var root = document.getElementById("f10-root");
          var defs = document.getElementById("f10-defs");
          var Q = function (s) { return root.querySelectorAll(s); };
          var F = function (n) { return n / 30; }; // local frame -> seconds
          defs.insertAdjacentHTML("beforeend", K.lensFilter("f10-lens-f", { w: 840, h: 540, r: 56, bezel: 54, dir: 1, power: 2, pad: 64 }));
          var lensF = document.getElementById("f10-lens-f");

          // facts (FACTS.md): value, digit field, suffix, label
          var VAL = [4, 58, 12, 3], DIG = [1, 2, 2, 1], SUF = ["", "", "+", ""];
          var LABS = ["YEARS DESIGNING", "PROJECTS", "ENTERPRISE PRODUCTS SHIPPED", "COMPANIES, 2 CITIES"];
          var S = [18, 33, 48, 63], L = [30, 45, 60, 75]; // count windows (arcade ticks) and landings on the stabs
          var MOVE = [32, 47, 62, 90]; // each number leaves for the ledger as the next count starts; the 4th rides the glide
          var TYPE = [4, 34, 49, 64]; // labels type at 60 cps
          // geometry: plate 840 x 540 at x 120 -> 960 (one plate-width); ledger in the plate's final flat area
          var HZ = 740, FH = 1560, NH = 44, RY = 818, GLIDE = 840;
          var NB = 590, LB = 650.64, SC = 0.32, XD = 1150, LX = 1236; // big baselines, ledger scale, digit edge, label column
          var ROW = function (i) { return 404 + 100 * i; };
          // each counter's block (landed number over its label) is centred in the plate; both share its left edge
          var BL = VAL.map(function (_, i) { return Math.round(540 - Math.max(180 * (DIG[i] + SUF[i].length), LABS[i].length * 17.76 - 3.4) / 2); });

          // world: haze, floor, scope-axis horizon, the plate's floor caustic, the rail beam, then all the type
          var copies = 0;
          // world type is duplicated under the glass and stacked for the cut's chroma split: tell the layout audit
          var LA = " data-layout-allow-occlusion data-layout-allow-overlap";
          function world() {
            var t = "f10-w" + copies++;
            var s = '<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs>';
            s += '<radialGradient id="' + t + '-haze" cx="960" cy="' + HZ + '" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 ' + HZ + ") scale(1150 330) translate(-960 -" + HZ + ')">';
            s += '<stop offset="0" stop-color="#3b1e6e" stop-opacity="0.85"/><stop offset="0.45" stop-color="#3b1e6e" stop-opacity="0.32"/><stop offset="1" stop-color="#3b1e6e" stop-opacity="0"/></radialGradient>';
            s += '<linearGradient id="' + t + '-fade" x1="0" y1="' + HZ + '" x2="0" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.18" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0.9"/></linearGradient>';
            s += '<mask id="' + t + '-floor" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1100"><rect x="0" y="' + HZ + '" width="1920" height="' + (1100 - HZ) + '" fill="url(#' + t + '-fade)"/></mask>';
            s += '<radialGradient id="' + t + '-caustic"><stop offset="0" stop-color="#ff2e97" stop-opacity="0.24"/><stop offset="1" stop-color="#ff2e97" stop-opacity="0"/></radialGradient></defs>';
            s += '<rect class="f10-haze" x="-200" y="300" width="2320" height="900" fill="url(#' + t + '-haze)"/>';
            s += '<g mask="url(#' + t + '-floor)" stroke="#4a2c8c" stroke-width="1.5" fill="none">';
            for (var i = -16; i <= 16; i++) s += '<line x1="960" y1="' + HZ + '" x2="' + (960 + i * 300) + '" y2="' + (HZ + 780) + '"/>';
            for (var k = 0; k < NH; k++) s += '<line class="f10-hl" x1="0" y1="1200" x2="1920" y2="1200"/>';
            s += '</g><g stroke="#22e6ff" stroke-opacity="0.42" stroke-width="1.6"><line x1="0" y1="' + HZ + '" x2="1920" y2="' + HZ + '"/>';
            for (var x = 0; x <= 1920; x += 48) { var tall = x % 240 === 0 ? 9 : 4; s += '<line x1="' + x + '" y1="' + (HZ - tall) + '" x2="' + x + '" y2="' + (HZ + tall) + '"/>'; }
            s += '</g><ellipse class="f10-caustic" cx="540" cy="812" rx="470" ry="30" fill="url(#' + t + '-caustic)"/>';
            s += '<g filter="url(#f10-bloom)" fill="none" stroke-linecap="round">';
            var B = "M -40 " + RY + " H 1960";
            s += '<path class="f10-b-old" d="' + B + '" stroke="#ff2e97" stroke-width="5" stroke-opacity="0.5"/>';
            s += '<path class="f10-b-core" d="' + B + '" stroke="#ffd9ec" stroke-width="2.2" stroke-opacity="0.5"/>';
            s += '<path class="f10-b-fresh" d="' + B + '" stroke="#ff2e97" stroke-width="6" stroke-opacity="0.85"/>';
            s += '<path class="f10-b-head" d="' + B + '" stroke="#ffffff" stroke-width="7"/></g></svg>';
            for (var n = 0; n < 4; n++) {
              s += '<div class="f10-num f10-n' + n + '" data-layout-allow-occlusion style="left:' + BL[n] + "px" + (n === 0 ? ";opacity:1" : "") + '"><span class="f10-gr"' + LA + '></span><span class="f10-gc"' + LA + "></span><strong" + LA + "></strong></div>";
              s += '<div class="f10-lab f10-l' + n + '" data-layout-allow-occlusion style="left:' + BL[n] + 'px"><span class="f10-lt"' + LA + '></span><span class="f10-car"></span></div>';
            }
            return s;
          }
          document.getElementById("f10-world-main").innerHTML = world();
          document.getElementById("f10-world-lens").innerHTML = world();

          var rows = Q(".f10-hl");
          function setGrid(phase) {
            for (var i = 0; i < rows.length; i++) { var y = K.gridRowY(i % NH, phase, HZ, FH); y = y > 1090 ? 1200 : y; rows[i].setAttribute("y1", y); rows[i].setAttribute("y2", y); }
          }
          function pad(v, n) { var s = String(v); while (s.length < n) s = "0" + s; return s; }
          function setNum(i, str) { var els = Q(".f10-n" + i + " > *"); for (var e = 0; e < els.length; e++) els[e].textContent = str; }
          function setLab(i, str) { var els = Q(".f10-l" + i + " .f10-lt"); for (var e = 0; e < els.length; e++) els[e].textContent = str; }
          for (var n0 = 0; n0 < 4; n0++) { setNum(n0, pad(0, DIG[n0])); setLab(n0, ""); }

          function c01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
          function p3io(u) { u = c01(u); return u < 0.5 ? 8 * u * u * u * u : 1 - Math.pow(2 - 2 * u, 4) / 2; } // power3.inOut
          function p3o(u) { u = c01(u); return 1 - Math.pow(1 - u, 4); } // power3.out
          // the tape clock: real time until 1305, then it slows to a stop over 15 f (power2.out, velocity-matched)
          function warp(t) { if (t <= 3.5) return t; var u = c01((t - 3.5) / 0.5); return 3.5 + (0.5 / 3) * (1 - Math.pow(1 - u, 3)); }

          var BLEN = 2002, oldB = Q(".f10-b-old, .f10-b-core"), fresh = Q(".f10-b-fresh"), head = Q(".f10-b-head");
          var plate = document.getElementById("f10-plate"), shadow = document.getElementById("f10-shadow");
          var lensWorld = document.getElementById("f10-world-lens"), rim = document.getElementById("f10-rim");
          var caustic = Q(".f10-caustic"), haze = Q(".f10-haze"), grain = document.getElementById("f10-grain");
          grain.style.backgroundImage = K.grainURL(1337);
          var GLASS = K.spring(0.55, 0.62, 1.2);
          K.dash(oldB, BLEN, BLEN, null);
          var gr = Q(".f10-n0 .f10-gr"), gc = Q(".f10-n0 .f10-gc");

          // one pure function of local time for the ambient world, the glass and the beam head
          function render(t) {
            var tau = warp(t), fr = Math.floor(t * 30 + 1e-6);
            // 1200 hard cut: the opening zero tears beam/cyan for 2 steps (+-6 px on 1200-1201, -+3 px on 1202), clean at 1203
            var off = fr < 2 ? 6 : fr < 3 ? -3 : 0;
            for (var q = 0; q < gr.length; q++) {
              gr[q].style.transform = "translateX(" + -off + "px)";
              gc[q].style.transform = "translateX(" + off + "px)";
              gr[q].style.opacity = gc[q].style.opacity = off ? 1 : 0;
            }
            setGrid(2 * tau);
            for (var h = 0; h < haze.length; h++) haze[h].style.opacity = (0.75 + 0.125 * (1 - Math.cos(Math.PI * tau))).toFixed(3);
            grain.style.backgroundPosition = K.grainPos(tau);
            // 1290 the plate glides one plate-width right (power3.inOut, 12 f); the lens copy counter-translates
            var g = p3io((t - 3) / 0.4), dx = GLIDE * g;
            plate.style.transform = shadow.style.transform = "translateX(" + dx.toFixed(2) + "px)";
            lensWorld.style.transform = "translateX(" + (-dx).toFixed(2) + "px)";
            for (var c = 0; c < caustic.length; c++) caustic[c].setAttribute("cx", (540 + dx).toFixed(1));
            // Tier H condense from the cut (one liquid wobble), rim light sweeps, then drifts; the glide catches light
            K.setRefraction(lensF, 72 * GLASS(c01(t / 1.2)));
            var spec = tau < 1.6 ? 110 + 100 * p3o(tau / 1.6) : 210 + 10 * (tau - 1.6);
            rim.style.setProperty("--spec", (spec + 40 * g).toFixed(1) + "deg");
            // the beam head enters at 1290 at pen speed (1350 px/s) and freezes with the tape
            var s = tau < 3 ? 0 : 1350 * (tau - 3);
            K.dash(fresh, BLEN, s, 560);
            K.dash(head, BLEN, s, 70);
          }
          render(0);

          var tl = gsap.timeline({ paused: true });
          var amb = { t: 0 };
          tl.to(amb, { t: 4, duration: 4, ease: "none", onUpdate: function () { render(amb.t); } }, 0);
          tl.to(".f10-skin", { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

          VAL.forEach(function (v, i) {
            var num = ".f10-n" + i, lab = ".f10-l" + i, txt = LABS[i], c = { v: 0 }, ty = { n: 0 };
            // the label types under the number (caret on while typing)
            tl.to(ty, { n: txt.length, duration: F(Math.ceil(txt.length / 2)), ease: "steps(" + txt.length + ")", onUpdate: function () { setLab(i, txt.slice(0, Math.round(ty.n))); } }, F(TYPE[i]));
            tl.set(lab + " .f10-car", { opacity: 1 }, F(TYPE[i]));
            tl.set(lab + " .f10-car", { opacity: 0 }, F(TYPE[i] + Math.ceil(txt.length / 2) + 4));
            // the count: arcade score in steps with leading zeros, growing 0.84 -> 1 in the same steps
            if (i > 0) tl.set(num, { opacity: 1 }, F(S[i]));
            var st = Math.min(v, 12);
            tl.to(c, { v: v, duration: F(12), ease: "steps(" + st + ")", onUpdate: function () { var k = Math.round(c.v); setNum(i, pad(k, DIG[i]) + (k >= v ? SUF[i] : "")); } }, F(S[i]));
            tl.fromTo(num, { scale: 0.84 }, { scale: 1, duration: F(12), ease: "steps(" + st + ")" }, F(S[i]));
            // the landing on the stab: volt with a glow. The 4th holds it a full beat; the first three cool to ink as they
            // fly to the ledger, so volt never sits on a numeral under 120 px (they are 96 px there)
            tl.set(num, { color: "#f5ff3b", "--glow": 0.55 }, F(L[i]));
            var cool = i < 3 ? [MOVE[i], 4] : [L[i] + 6, 9];
            tl.fromTo(num, { color: "#f5ff3b", "--glow": 0.55 }, { color: "#f3eeff", "--glow": 0, duration: F(cool[1]), ease: "power2.out", immediateRender: false }, F(cool[0]));
            // into the ledger: number scales to 96 px with its digits right-aligned on XD, label joins the column
            var mv = i < 3 ? { duration: 0.35, ease: "expo.out" } : { duration: F(12), ease: "power3.inOut" };
            var nx = XD - 57.6 * DIG[i] - BL[i], ny = ROW(i) - NB;
            tl.fromTo(num, { x: 0, y: 0, scale: 1 }, Object.assign({ x: nx, y: ny, scale: SC, immediateRender: false }, mv), F(MOVE[i]));
            tl.fromTo(lab, { x: 0, y: 0 }, Object.assign({ x: LX - BL[i], y: ROW(i) - 24.75 - LB, immediateRender: false }, mv), F(MOVE[i]));
          });

          // 1305-1320 tape-stop: the frame sags 4 px with the slowing clock (power2.out); render() freezes the rest
          tl.fromTo(".f10-stage", { y: 0 }, { y: 4, duration: F(15), ease: "power2.out" }, F(105));

          window.__timelines["f10"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
