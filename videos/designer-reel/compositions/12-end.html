<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- F12 "Invitation" (film 1380-1560, 6 s). The tube powers back on ON the final lift: F11's dot snaps to a white-hot
         raster line on 1380 (the brightest frames are 1380-1382), then the line opens to the frame (1382-1388).
         End card: his portrait in a Tier H slab (left), the name slams (1388), "Product designer" wipes (1395), the
         status chip condenses on the floor with one rim-light lap (1410), contact lines type (1425-1453), and the beam
         signs off as a routed trace (45 deg bends): leg 1 out of the glass into pad A (1440-1455), leg 2 into pad B on
         the final chord (1470-1500); hold, then fade to void-deep (1530-1560).
         Local time = film frame - 1380. Needs window.ReelKit (assets/lib/reel-kit.js). -->
  </head>
  <body>
    <template id="f12-template">
      <style>
        @font-face { font-family: "Mona Sans"; src: url("assets/fonts/MonaSans-var.woff2") format("woff2"); font-weight: 200 900; font-stretch: 75% 125%; }
        @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-normal.woff2") format("woff2"); font-weight: 100 800; }
        #f12-root { position: absolute; inset: 0; overflow: hidden; background: #070410; }
        #f12-tube { position: absolute; inset: 0; overflow: hidden; background: #0b0716; }
        .f12-world, .f12-world svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        .f12-world { background: #0b0716; }
        #f12-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 74% at 50% 50%, rgba(7, 4, 16, 0) 58%, rgba(7, 4, 16, 0.72) 100%); }

        /* type column: one left edge at x 720 (slab 120-600 + a 120 px gutter); all of it sits above the floor */
        .f12-mask { position: absolute; left: 712px; height: 170px; overflow: hidden; padding: 0 8px; }
        #f12-m1 { top: 83px; }
        #f12-m2 { top: 255px; }
        .f12-name { display: block; font-family: "Mona Sans", sans-serif; font-size: 176px; line-height: 0.92; letter-spacing: -0.01em; color: #f3eeff; --wdth: 125; font-variation-settings: "wdth" var(--wdth), "wght" 900; white-space: nowrap; }
        #f12-role { position: absolute; left: 720px; top: 436px; font-family: "Mona Sans", sans-serif; font-size: 52px; line-height: 1.2; font-variation-settings: "wdth" 100, "wght" 380; color: #f3eeff; white-space: nowrap; clip-path: inset(0 100% 0 0); }
        .f12-contact { position: absolute; left: 720px; font: 500 32px/1 "JetBrains Mono", monospace; letter-spacing: 0.02em; color: #f3eeff; white-space: nowrap; }
        #f12-c1 { top: 664px; }
        #f12-c2 { top: 716px; color: #b4a8da; }
        .f12-caret { display: inline-block; width: 0.6em; height: 1em; margin-left: 6px; vertical-align: -0.12em; background: #ff2e97; opacity: 0; }

        /* Tier H liquid glass: the portrait slab (lens over a duplicated world), on the 120 px margin */
        #f12-slab, #f12-slab-shadow { position: absolute; left: 120px; top: 100px; width: 480px; height: 880px; border-radius: 76px; }
        #f12-slab { overflow: hidden; isolation: isolate; }
        #f12-slab-shadow { box-shadow: 0 60px 90px -40px rgba(7, 4, 16, 0.95); }
        #f12-lens { position: absolute; inset: 0; filter: url(#f12-lens-f); }
        #f12-lens > .f12-world { left: -120px; top: -100px; }
        #f12-screen { position: absolute; left: 40px; top: 40px; width: 400px; height: 800px; border-radius: 40px; overflow: hidden; background: #0e0d10; }
        #f12-screen img { position: absolute; left: -121px; top: 0; width: 667px; height: 800px; display: block; }
        #f12-dither { image-rendering: pixelated; }
        .f12-tint { position: absolute; inset: 0; border-radius: inherit; background: rgba(180, 150, 255, 0.07); }
        .f12-shade { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 2px 1px -1px rgba(255, 255, 255, 0.7), inset 0 26px 40px -30px rgba(255, 255, 255, 0.35), inset 0 -34px 54px -34px rgba(34, 230, 255, 0.28), inset 0 0 36px rgba(255, 255, 255, 0.05), inset 0 0 0 1px rgba(243, 238, 255, 0.1); }
        .f12-grim { position: absolute; inset: 0; border-radius: inherit; padding: 2px; --spec: 150deg; background: conic-gradient(from var(--spec), rgba(255, 255, 255, 0.95) 0deg, rgba(255, 255, 255, 0.18) 46deg, rgba(255, 255, 255, 0) 90deg, rgba(255, 46, 151, 0.7) 168deg, rgba(255, 255, 255, 0) 214deg, rgba(34, 230, 255, 0.45) 300deg, rgba(255, 255, 255, 0.95) 360deg); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

        /* Tier B status chip standing on the floor (backdrop lens, inward rim: the floor lines bend at its edge),
           bottom aligned with the slab; the rim light that runs once around it is its only light */
        #f12-chip { position: absolute; left: 720px; top: 904px; width: 760px; height: 76px; border-radius: 38px; backdrop-filter: url(#f12-chip-f); box-shadow: 0 24px 40px -20px rgba(7, 4, 16, 0.9); opacity: 0; transform-origin: 38px 38px; }
        #f12-chip .f12-tint { background: rgba(20, 12, 38, 0.42); }
        /* the tint rises to ~0.84 behind the label (feathered, no inner edge) so the floor rows don't cross the type;
           the 10-26 px rim band keeps the plain tint, so the bent floor still reads through the glass there */
        #f12-chip-veil { position: absolute; inset: 9px 24px; background: rgba(20, 12, 38, 0.72); -webkit-mask: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent), linear-gradient(180deg, transparent, #000 15px, #000 calc(100% - 15px), transparent); -webkit-mask-composite: source-in; mask-composite: intersect; }
        #f12-chip-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-left: 0.14em; font: 500 24px/1 "JetBrains Mono", monospace; letter-spacing: 0.14em; color: #f3eeff; white-space: nowrap; }
        .f12-rl { position: absolute; left: 680px; top: 864px; width: 840px; height: 156px; overflow: visible; opacity: 0; }

        /* power-on: the raster line (a light source, so it may bloom), its halo, the two raster edges, a capped flash */
        #f12-scan { position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(7, 4, 16, 0.55) 0 1px, rgba(7, 4, 16, 0) 1px 3px); opacity: 0; }
        #f12-flash { position: absolute; inset: 0; background: #ffd9ec; opacity: 0; }
        /* the line's phosphor bloom: an even band along the whole line (not a flare), ~gaussian in y, only on 1380-1385 */
        /* two gaussians (sigma 40 / 140 px), beam-core easing to beam, baked as a pre-dithered RGBA strip (clumped 2 px
           triangular noise, +-8 alpha units) so the H.264 encode cannot band its dark edges; tiles across x */
        #f12-halo { position: absolute; left: 0; top: 190px; width: 1920px; height: 700px; opacity: 0; background: url("assets/img/f12-halo.png") 0 0 / 512px 700px repeat-x; }
        .f12-line { position: absolute; left: 0; width: 1920px; background: #ffd9ec; opacity: 0; }
        #f12-cline { top: 537px; height: 6px; background: #ffffff; box-shadow: 0 0 8px 2px rgba(255, 217, 236, 0.95), 0 0 28px 8px rgba(255, 46, 151, 0.5), 0 0 90px 24px rgba(255, 46, 151, 0.2); }
        .f12-edge { top: 539px; height: 2px; box-shadow: 0 0 8px 2px rgba(255, 217, 236, 0.7), 0 0 26px 6px rgba(255, 46, 151, 0.25); }
        #f12-fade { position: absolute; inset: 0; background: #070410; opacity: 0; }
        #f12-grain { position: absolute; inset: 0; opacity: 0.1; mix-blend-mode: overlay; }
      </style>

      <div id="f12-root" data-composition-id="f12" data-width="1920" data-height="1080" data-duration="6">
        <div id="f12-scene" class="clip" data-start="0" data-duration="6" data-track-index="0">
          <div id="f12-tube">
            <div class="f12-world" id="f12-world-main" data-layout-allow-overflow></div>
            <div id="f12-vignette" data-layout-ignore></div>

            <div id="f12-slab-shadow"></div>
            <div id="f12-slab">
              <div id="f12-lens">
                <div class="f12-world" id="f12-world-lens" data-layout-allow-overflow></div>
                <div id="f12-screen">
                  <!-- his portrait, baked offline by assets/lib/bake.py (phosphor print: duotone + 4-ink dither) -->
                  <img id="f12-duo" src="assets/img/portrait-duo.png" alt="Surajit Dutta" data-layout-allow-overflow />
                  <img id="f12-dither" src="assets/img/portrait-dither.png" alt="" data-layout-allow-overflow />
                </div>
              </div>
              <div class="f12-tint"></div>
              <div class="f12-shade"></div>
              <div class="f12-grim" id="f12-rim"></div>
            </div>

            <div class="f12-mask" id="f12-m1"><span class="f12-name" id="f12-n1" data-layout-allow-overflow data-layout-allow-occlusion>SURAJIT</span></div>
            <div class="f12-mask" id="f12-m2"><span class="f12-name" id="f12-n2" data-layout-allow-overflow data-layout-allow-occlusion>DUTTA</span></div>
            <div id="f12-role">Product designer</div>

            <div class="f12-contact" id="f12-c1"><span id="f12-c1-t"></span><span class="f12-caret" id="f12-k1"></span></div>
            <div class="f12-contact" id="f12-c2"><span id="f12-c2-t"></span><span class="f12-caret" id="f12-k2"></span></div>

            <svg class="f12-rl" id="f12-rl-under" viewBox="0 0 840 156" aria-hidden="true" data-layout-ignore><defs><g id="f12-rl-glow"></g><g id="f12-rl-core"></g></defs><g transform="translate(40,40)" id="f12-rl-u"></g></svg>
            <div id="f12-chip">
              <div class="f12-tint"></div>
              <div id="f12-chip-veil"></div>
              <div class="f12-shade"></div>
              <div class="f12-grim" id="f12-chip-rim"></div>
              <div id="f12-chip-text"><span>OPEN TO SENIOR ROLES &amp; SELECT FREELANCE</span></div>
            </div>
            <svg class="f12-rl" id="f12-rl-over" viewBox="0 0 840 156" aria-hidden="true" data-layout-ignore><g transform="translate(40,40)" id="f12-rl-o"></g></svg>

            <div id="f12-scan" data-layout-ignore></div>
            <div id="f12-flash" data-layout-ignore></div>
          </div>
          <div id="f12-halo" data-layout-ignore></div>
          <div class="f12-line f12-edge" id="f12-edge-t" data-layout-ignore></div>
          <div class="f12-line f12-edge" id="f12-edge-b" data-layout-ignore></div>
          <div class="f12-line" id="f12-cline" data-layout-ignore></div>
          <div id="f12-fade" data-layout-ignore></div>
          <div id="f12-grain" data-layout-ignore></div>

          <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs id="f12-defs">
              <!-- bloom regions hug the trace (frame copy) and the slab's right bezel (lens copy): bbox + 60 px -->
              <filter id="f12-bloom" x="496" y="486" width="1278" height="292" filterUnits="userSpaceOnUse">
                <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1" /><feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2" />
                <feMerge><feMergeNode in="b2" /><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
              <filter id="f12-bloom-lens" x="496" y="560" width="210" height="218" filterUnits="userSpaceOnUse">
                <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1" /><feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2" />
                <feMerge><feMergeNode in="b2" /><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
            </defs>
          </svg>
        </div>
      </div>

      <script>
        (function () {
          var K = window.ReelKit;
          var root = document.getElementById("f12-root");
          var defs = document.getElementById("f12-defs");
          function F(f) { return (f - 1380) / 30; } // film frame -> local seconds
          defs.insertAdjacentHTML("beforeend", K.lensFilter("f12-lens-f", { w: 480, h: 880, r: 76, bezel: 84, dir: 1, power: 2, pad: 90 }));
          defs.insertAdjacentHTML("beforeend", K.lensFilter("f12-chip-f", { w: 760, h: 76, r: 38, bezel: 32, dir: -1, power: 1.6 }));
          var lensF = document.getElementById("f12-lens-f"), chipF = document.getElementById("f12-chip-f");
          K.setRefraction(lensF, 112);

          // The sign-off, routed like a PCB trace (45 deg bends only). It is born under the portrait's edge and climbs out
          // through the slab's right rim on a diagonal (so the glass visibly kinks it), runs flat under "Product designer",
          // stops on pad A at the bend, steps down and runs out to pad B.
          var HZ = 800, FH = 1560, NH = 44;
          var A = [1150, 558], B = [1714, 606];
          var SIG = "M 556 716 L 714 558 H " + A[0] + " L 1198 606 H " + B[0];
          var copies = 0;
          function world(bloom) {
            var t = "f12-w" + copies++; // unique gradient/mask ids per copy
            var s = '<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs>';
            s += '<radialGradient id="' + t + '-haze" cx="960" cy="' + HZ + '" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 ' + HZ + ') scale(1150 330) translate(-960 -' + HZ + ')">';
            s += '<stop offset="0" stop-color="#3b1e6e" stop-opacity="0.85"/><stop offset="0.45" stop-color="#3b1e6e" stop-opacity="0.32"/><stop offset="1" stop-color="#3b1e6e" stop-opacity="0"/></radialGradient>';
            s += '<linearGradient id="' + t + '-fade" x1="0" y1="' + HZ + '" x2="0" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.18" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0.9"/></linearGradient>';
            s += '<mask id="' + t + '-floor" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect x="0" y="' + HZ + '" width="1920" height="' + (1080 - HZ) + '" fill="url(#' + t + '-fade)"/></mask>';
            s += '<radialGradient id="' + t + '-caustic"><stop offset="0" stop-color="#ff2e97" stop-opacity="0.3"/><stop offset="1" stop-color="#ff2e97" stop-opacity="0"/></radialGradient></defs>';
            s += '<rect class="f12-haze" x="-200" y="' + (HZ - 500) + '" width="2320" height="1000" fill="url(#' + t + '-haze)"/>';
            s += '<g mask="url(#' + t + '-floor)" stroke="#4a2c8c" stroke-width="1.5" fill="none">';
            for (var i = -16; i <= 16; i++) s += '<line x1="960" y1="' + HZ + '" x2="' + (960 + i * 300) + '" y2="' + (HZ + 780) + '"/>';
            for (var k = 0; k < NH; k++) s += '<line class="f12-hl" x1="0" y1="1200" x2="1920" y2="1200"/>';
            s += '</g><g stroke="#22e6ff" stroke-opacity="0.42" stroke-width="1.6"><line x1="0" y1="' + HZ + '" x2="1920" y2="' + HZ + '"/>';
            for (var x = 0; x <= 1920; x += 48) {
              var tall = x % 240 === 0 ? 9 : 4;
              s += '<line x1="' + x + '" y1="' + (HZ - tall) + '" x2="' + x + '" y2="' + (HZ + tall) + '"/>';
            }
            s += '</g><ellipse cx="360" cy="1000" rx="269" ry="30" fill="url(#' + t + '-caustic)"/>';
            s += '<g filter="url(#' + bloom + ')" fill="none" stroke-linecap="round" stroke-linejoin="round">';
            s += '<path class="f12-b-old" d="' + SIG + '" stroke="#ff2e97" stroke-width="5" stroke-opacity="0.5"/>';
            s += '<path class="f12-b-fresh" d="' + SIG + '" stroke="#ff2e97" stroke-width="6"/>';
            s += '<path class="f12-b-core" d="' + SIG + '" stroke="#ffd9ec" stroke-width="2.2"/>';
            s += '<path class="f12-b-head" d="' + SIG + '" stroke="#ffffff" stroke-width="7"/>';
            s += '<circle class="f12-pad f12-pad-a" cx="' + A[0] + '" cy="' + A[1] + '" r="11" stroke="#ff2e97" stroke-width="3.5" fill="#0b0716"/>';
            s += '<circle class="f12-pad f12-pad-b" cx="' + B[0] + '" cy="' + B[1] + '" r="11" stroke="#ff2e97" stroke-width="3.5" fill="#0b0716"/>';
            return s + "</g></svg>";
          }
          document.getElementById("f12-world-main").innerHTML = world("f12-bloom");
          document.getElementById("f12-world-lens").innerHTML = world("f12-bloom-lens");

          var rows = root.querySelectorAll(".f12-hl");
          function setGrid(phase) {
            for (var i = 0; i < rows.length; i++) {
              var y = K.gridRowY(i % NH, phase, HZ, FH);
              y = y > 1090 ? 1200 : y;
              rows[i].setAttribute("y1", y);
              rows[i].setAttribute("y2", y);
            }
          }
          var LEN = Math.ceil(root.querySelector(".f12-b-old").getTotalLength()) + 2, LA = 158 * Math.SQRT2 + (A[0] - 714); // LA: arc length to pad A
          var drawn = root.querySelectorAll(".f12-b-old, .f12-b-core"), fresh = root.querySelectorAll(".f12-b-fresh"), head = root.querySelectorAll(".f12-b-head");
          function setBeam(s) { K.dash(drawn, LEN, s, null); K.dash(fresh, LEN, s, 560); K.dash(head, LEN, s, 70); }
          // pen: trapezoid velocity (ramp up over a, cruise, brake over d into the pad: power2-style stop, velocity-matched)
          function pen(a, d) {
            var v = 1 / (1 - (a + d) / 2);
            return function (p) { return p < a ? (v * p * p) / (2 * a) : p <= 1 - d ? v * (a / 2 + p - a) : 1 - (v * (1 - p) * (1 - p)) / (2 * d); };
          }

          // Rim light (edge-travel math from compositions/lt-neon-border.html, recoloured beam / beam-core, one lap)
          var NS = "http://www.w3.org/2000/svg", RW = 760, RH = 76, RR = 38;
          var RD = "M " + RR + " 0 H " + (RW - RR) + " A " + RR + " " + RR + " 0 0 1 " + (RW - RR) + " " + RH + " H " + RR + " A " + RR + " " + RR + " 0 0 1 " + RR + " 0 Z";
          function buildSegs(id, count, falloff) {
            var g = document.getElementById(id), segs = [];
            for (var i = 0; i < count; i++) {
              var p = document.createElementNS(NS, "path");
              p.setAttribute("d", RD);
              p.setAttribute("fill", "none");
              p.setAttribute("stroke-linecap", i === 0 ? "round" : "butt");
              p.setAttribute("opacity", String(Math.pow(1 - i / count, falloff)));
              g.appendChild(p);
              segs.push(p);
            }
            return segs;
          }
          var glowSegs = buildSegs("f12-rl-glow", 20, 2.6), coreSegs = buildSegs("f12-rl-core", 26, 1.4);
          var RP = glowSegs[0].getTotalLength(), GLOW_LEN = 0.24 * RP, CORE_LEN = 0.34 * GLOW_LEN;
          [
            { blur: 22, w: 36, o: 0.22, c: "#ff2e97", under: true, ref: "glow" },
            { blur: 11, w: 22, o: 0.34, c: "#ff2e97", under: true, ref: "glow" },
            { blur: 5, w: 12, o: 0.55, c: "#ff2e97", under: true, ref: "glow" },
            { blur: 2.5, w: 4, o: 0.9, c: "#ffd9ec", under: false, ref: "core" },
            { blur: 0, w: 2.6, o: 1, c: "#ffffff", under: false, ref: "core" },
          ].forEach(function (L) {
            var u = document.createElementNS(NS, "use");
            u.setAttribute("href", "#f12-rl-" + L.ref);
            u.setAttribute("stroke", L.c);
            u.setAttribute("stroke-width", String(L.w));
            u.setAttribute("opacity", String(L.o));
            if (L.blur) u.style.filter = "blur(" + L.blur + "px)";
            document.getElementById(L.under ? "f12-rl-u" : "f12-rl-o").appendChild(u);
          });
          function lay(segs, h, length) {
            var step = length / segs.length;
            for (var i = 0; i < segs.length; i++) {
              var st = h - (i + 1) * step;
              st = ((st % RP) + RP) % RP;
              segs[i].setAttribute("stroke-dasharray", step + " " + (RP - step));
              segs[i].setAttribute("stroke-dashoffset", String(-st));
            }
          }
          var RSTART = 2 * (RW - 2 * RR) + 1.5 * Math.PI * RR; // the left cap's midpoint: the lap starts where the chip grows from
          function glide(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; } // cubic in-out
          function setRim(p) { var h = RSTART + RP * glide(p); lay(glowSegs, h, GLOW_LEN); lay(coreSegs, h, CORE_LEN); }

          // contacts type at about 60 characters per second; one caret hands over from line 1 to line 2
          var C1 = "surajit3255@gmail.com", C2 = "surajit-dutta.vercel.app";
          var c1 = document.getElementById("f12-c1-t"), c2 = document.getElementById("f12-c2-t");
          var k1 = document.getElementById("f12-k1"), k2 = document.getElementById("f12-k2");
          var T1 = F(1425), T2 = F(1441), E2 = T2 + C2.length / 60;
          function typeAt(t) {
            c1.textContent = C1.slice(0, Math.max(0, Math.min(C1.length, Math.floor((t - T1) * 60 + 1e-6))));
            c2.textContent = C2.slice(0, Math.max(0, Math.min(C2.length, Math.floor((t - T2) * 60 + 1e-6))));
            k1.style.opacity = t >= T1 && t < T2 ? 1 : 0;
            var b = Math.floor((t - E2) / 0.25 + 1e-6);
            k2.style.opacity = t < T2 ? 0 : t < E2 ? 1 : b < 6 && b % 2 === 0 ? 1 : 0;
          }

          var grain = document.getElementById("f12-grain");
          grain.style.backgroundImage = K.grainURL(1337);
          setGrid(0);
          setBeam(0);
          setRim(0);
          typeAt(0);

          var tl = gsap.timeline({ paused: true, defaults: { lazy: false } });

          // master clock: floor at rest (x0.5: one cell per bar), grain, typing are pure functions of local time
          var clock = { t: 0 };
          tl.to(clock, { t: 6, duration: 6, ease: "none", onUpdate: function () { setGrid(clock.t); typeAt(clock.t); grain.style.backgroundPosition = K.grainPos(clock.t); } }, 0);
          tl.fromTo(root.querySelectorAll(".f12-haze"), { opacity: 0.75 }, { opacity: 1, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);

          // 1380-1382 THE PUNCH, on the lift's downbeat: F11's dot is already a full-width white-hot raster line with its
          // halo (the brightest frames of the end). 1382: the line splits into the raster's two edges and the tube opens
          // to the frame (scaleY, expo.out). The flash under it is capped at 8% and gone in 0.2 s: no wash.
          tl.fromTo("#f12-tube", { scaleY: 0.006 }, { scaleY: 1, duration: 0.24, ease: "expo.out" }, F(1382));
          tl.fromTo("#f12-cline", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.in" }, F(1382));
