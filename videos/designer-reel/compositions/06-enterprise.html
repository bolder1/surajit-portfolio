<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- F6 "miniOrange, 2024 -> now" (film 600-780, 6 s). Dolly in over the vector floor past three real
         captures in tilted Tier B frames; the hero capture lands under a Tier H device; on the 720 stab the
         beam pulls itself off the floor into one straight 2 px stroke (the design system's single stroke)
         and the device cuts to the MODS docs. Holds, hard cut at 780 (F7 owns the chroma split).
         Local time = film frame - 600. Needs window.ReelKit (assets/lib/reel-kit.js). -->
  </head>
  <body>
    <template id="f06-template">
      <style>
        @font-face { font-family: "Mona Sans"; src: url("assets/fonts/MonaSans-var.woff2") format("woff2"); font-weight: 200 900; font-stretch: 75% 125%; }
        @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-normal.woff2") format("woff2"); font-weight: 100 800; }
        #f06-root { position: absolute; inset: 0; overflow: hidden; background: #0b0716; }
        #f06-stage { position: absolute; inset: 0; }
        .f06-world, .f06-world svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        .f06-world { background: #0b0716; }
        /* oversized so the 0.8 dolly-in scale never shows its edge; radii = 78% x 74% of the frame */
        #f06-vignette { position: absolute; left: -480px; top: -270px; width: 2880px; height: 1620px; background: radial-gradient(ellipse 1497.6px 799.2px at 50% 50%, rgba(7, 4, 16, 0) 58%, rgba(7, 4, 16, 0.72) 100%); }

        /* type */
        .f06-label { position: absolute; left: 120px; font: 500 24px/1 "JetBrains Mono", monospace; letter-spacing: 0.14em; color: #b4a8da; white-space: nowrap; }
        #f06-marker { top: 176px; }
        #f06-marker svg { width: 34px; height: 16px; margin: 0 14px 0 6px; vertical-align: 0; overflow: visible; opacity: 0; }
        #f06-tag { top: 548px; font-size: 22px; }
        #f06-spec { top: 590px; color: #f3eeff; }
        .f06-caret { display: inline-block; width: 0.6em; height: 1em; margin-left: 6px; vertical-align: -0.12em; background: #ff2e97; opacity: 0; }
        .f06-line { position: absolute; left: 120px; font-family: "Mona Sans", sans-serif; font-size: 56px; line-height: 1.2; font-variation-settings: "wdth" 100, "wght" 380; color: #f3eeff; white-space: nowrap; clip-path: inset(0 100% 0 0); }
        #f06-l1 { top: 272px; }
        #f06-l2 { top: 339px; }

        /* Tier B capture frames on the fly-by (backdrop-filter, inward rim; Tier B may scale and rotate) */
        .f06-card { position: absolute; left: 640px; top: 480px; width: 640px; height: 420px; border-radius: 34px; box-shadow: 0 60px 90px -40px rgba(7, 4, 16, 0.95); opacity: 0; }
        #f06-c0 { backdrop-filter: url(#f06-c0-f); }
        #f06-c1 { backdrop-filter: url(#f06-c1-f); }
        #f06-c2 { backdrop-filter: url(#f06-c2-f); }
        .f06-card .lg-tint { background: rgba(20, 12, 38, 0.42); }
        .f06-shot { position: absolute; left: 20px; top: 20px; width: 600px; height: 380px; border-radius: 16px; overflow: hidden; background: #0e0d10; }
        .f06-shot img { position: absolute; left: 0; top: 0; width: 600px; height: 380px; object-fit: cover; object-position: 50% 0; display: block; }
        .f06-scan { position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(7, 4, 16, 0.55) 0 1px, rgba(7, 4, 16, 0) 1px 3px); opacity: 0; }
        .f06-flash { position: absolute; inset: 0; background: #ffd9ec; opacity: 0; }

        /* Tier H liquid glass: the hero device (lens over a duplicated world) */
        #f06-device, #f06-device-shadow { position: absolute; left: 1240px; top: 100px; width: 480px; height: 880px; border-radius: 76px; }
        #f06-device { overflow: hidden; isolation: isolate; opacity: 0; }
        #f06-device-shadow { box-shadow: 0 60px 90px -40px rgba(7, 4, 16, 0.95); }
        #f06-lens { position: absolute; inset: 0; filter: url(#f06-lens-f); }
        #f06-lens > .f06-world { left: -1240px; top: -100px; }
        #f06-screen { position: absolute; left: 40px; top: 40px; width: 400px; height: 800px; border-radius: 40px; overflow: hidden; background: #0e0d10; opacity: 0; }
        #f06-screen img { position: absolute; left: 0; top: 0; width: 400px; display: block; }
        .lg-tint { position: absolute; inset: 0; border-radius: inherit; background: rgba(180, 150, 255, 0.07); }
        .lg-shade { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 2px 1px -1px rgba(255, 255, 255, 0.7), inset 0 26px 40px -30px rgba(255, 255, 255, 0.35), inset 0 -34px 54px -34px rgba(34, 230, 255, 0.28), inset 0 0 36px rgba(255, 255, 255, 0.05), inset 0 0 0 1px rgba(243, 238, 255, 0.1); }
        .lg-rim { position: absolute; inset: 0; border-radius: inherit; padding: 2px; --spec: 150deg; background: conic-gradient(from var(--spec), rgba(255, 255, 255, 0.95) 0deg, rgba(255, 255, 255, 0.18) 46deg, rgba(255, 255, 255, 0) 90deg, rgba(255, 46, 151, 0.7) 168deg, rgba(255, 255, 255, 0) 214deg, rgba(34, 230, 255, 0.45) 300deg, rgba(255, 255, 255, 0.95) 360deg); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        .f06-skin { opacity: 0; }

        #f06-grain { position: absolute; inset: 0; opacity: 0.1; mix-blend-mode: overlay; }
      </style>

      <div id="f06-root" data-composition-id="f06" data-width="1920" data-height="1080" data-duration="6">
        <div id="f06-scene" class="clip" data-start="0" data-duration="6" data-track-index="0">
          <div id="f06-stage">
            <div class="f06-world" id="f06-world-main" data-layout-allow-overflow></div>
            <div id="f06-vignette" data-layout-ignore></div>

            <div class="f06-card" id="f06-c0" data-layout-allow-overflow><div class="lg-tint"></div><div class="lg-shade"></div><div class="lg-rim"></div>
              <div class="f06-shot"><img src="assets/img/f06-iga-overview.png" alt="IGA overview" /><div class="f06-scan"></div><div class="f06-flash"></div></div></div>
            <div class="f06-card" id="f06-c1" data-layout-allow-overflow><div class="lg-tint"></div><div class="lg-shade"></div><div class="lg-rim"></div>
              <div class="f06-shot"><img src="assets/img/f06-uem-discovery-d.lift.jpg" alt="UEM discovery" /><div class="f06-scan"></div><div class="f06-flash"></div></div></div>
            <div class="f06-card" id="f06-c2" data-layout-allow-overflow><div class="lg-tint"></div><div class="lg-shade"></div><div class="lg-rim"></div>
              <div class="f06-shot"><img src="assets/img/f06-ds-cover.png" alt="Design system cover" /><div class="f06-scan"></div><div class="f06-flash"></div></div></div>

            <div id="f06-device-shadow" class="f06-skin"></div>
            <div id="f06-device">
              <div id="f06-lens">
                <div class="f06-world" id="f06-world-lens" data-layout-allow-overflow></div>
                <div id="f06-screen">
                  <!-- exposure-only lift baked offline (frame.md, Asset treatment) -->
                  <img id="f06-uem" src="assets/img/uem-mobile-m.lift.jpg" alt="UEM mobile" data-layout-allow-overflow />
                  <img id="f06-mods" src="assets/img/f06-mods-docs-m.lift.jpg" alt="MODS docs" style="opacity: 0" data-layout-allow-overflow />
                  <div class="f06-scan" id="f06-scan"></div>
                  <div class="f06-flash" id="f06-flash"></div>
                </div>
              </div>
              <div class="lg-tint f06-skin"></div>
              <div class="lg-shade f06-skin"></div>
              <div class="lg-rim f06-skin" id="f06-rim"></div>
            </div>

            <div class="f06-label" id="f06-marker"><span id="f06-m1"></span><svg viewBox="0 0 34 16" aria-hidden="true"><path d="M1 8 H31 M24 1.5 L31 8 L24 14.5" fill="none" stroke="#b4a8da" stroke-width="2.4" stroke-linecap="square" /></svg><span id="f06-m2"></span><span class="f06-caret" id="f06-caret1"></span></div>
            <div class="f06-line" id="f06-l1">Enterprise software for IT,</div>
            <div class="f06-line" id="f06-l2">identity &amp; security teams.</div>
            <div class="f06-label" id="f06-tag"><span id="f06-tag-text"></span></div>
            <div class="f06-label" id="f06-spec"><span id="f06-spec-text"></span><span class="f06-caret" id="f06-caret2"></span></div>
          </div>
          <div id="f06-grain" data-layout-ignore></div>

          <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs id="f06-defs">
              <!-- bloom regions hug the beam: frame copy (floor trace + the straight stroke) and the lens copy -->
              <filter id="f06-bloom" x="-400" y="470" width="2720" height="600" filterUnits="userSpaceOnUse">
                <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1" /><feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2" />
                <feMerge><feMergeNode in="b2" /><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
              <filter id="f06-bloom-lens" x="1150" y="400" width="660" height="680" filterUnits="userSpaceOnUse">
                <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1" /><feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2" />
                <feMerge><feMergeNode in="b2" /><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
            </defs>
          </svg>
        </div>
      </div>

      <script>
        (function () {
          var K = window.ReelKit;
          var root = document.getElementById("f06-root");
          var defs = document.getElementById("f06-defs");
          defs.insertAdjacentHTML("beforeend", K.lensFilter("f06-lens-f", { w: 480, h: 880, r: 76, bezel: 84, dir: 1, power: 2, pad: 90 }));
          var lensF = document.getElementById("f06-lens-f");
          var HZ = 690, FH = 1560, NH = 44, YS = 520; // horizon, floor height, rows; YS = the straight stroke

          // world: haze, floor, scope-axis horizon, the device's floor caustic (cyan: a powered screen), beam.
          // Built twice (frame + inside the lens); setters target classes so both copies move together.
          var copies = 0;
          function world(bloom) {
            var t = "f06-w" + copies++;
            var s = '<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs>';
            s += '<radialGradient id="' + t + '-haze" cx="960" cy="' + HZ + '" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 ' + HZ + ") scale(1150 330) translate(-960 -" + HZ + ')">';
            s += '<stop offset="0" stop-color="#3b1e6e" stop-opacity="0.85"/><stop offset="0.45" stop-color="#3b1e6e" stop-opacity="0.32"/><stop offset="1" stop-color="#3b1e6e" stop-opacity="0"/></radialGradient>';
            s += '<linearGradient id="' + t + '-fade" x1="0" y1="' + HZ + '" x2="0" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.18" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0.9"/></linearGradient>';
            s += '<mask id="' + t + '-floor" maskUnits="userSpaceOnUse" x="-600" y="0" width="3120" height="1600"><rect x="-600" y="' + HZ + '" width="3120" height="900" fill="url(#' + t + '-fade)"/></mask>';
            s += '<radialGradient id="' + t + '-caustic"><stop offset="0" stop-color="#22e6ff" stop-opacity="0.3"/><stop offset="1" stop-color="#22e6ff" stop-opacity="0"/></radialGradient></defs>';
            s += '<rect class="f06-haze" x="-600" y="200" width="3120" height="1200" fill="url(#' + t + '-haze)"/>';
            s += '<g mask="url(#' + t + '-floor)" stroke="#4a2c8c" stroke-width="1.5" fill="none">';
            for (var i = -16; i <= 16; i++) s += '<line x1="960" y1="' + HZ + '" x2="' + (960 + i * 300) + '" y2="' + (HZ + 780) + '"/>';
            for (var k = 0; k < NH; k++) s += '<line class="f06-hl" x1="-600" y1="1600" x2="2520" y2="1600"/>';
            s += '</g><g stroke="#22e6ff" stroke-opacity="0.42" stroke-width="1.6"><line x1="-600" y1="' + HZ + '" x2="2520" y2="' + HZ + '"/>';
            for (var x = -480; x <= 2400; x += 48) { var tall = (x + 4800) % 240 === 0 ? 9 : 4; s += '<line x1="' + x + '" y1="' + (HZ - tall) + '" x2="' + x + '" y2="' + (HZ + tall) + '"/>'; }
            s += '</g><ellipse class="f06-skin" cx="1480" cy="1000" rx="269" ry="30" fill="url(#' + t + '-caustic)"/>';
            s += '<g filter="url(#' + bloom + ')" fill="none" stroke-linecap="round" stroke-linejoin="round">';
            s += '<path class="f06-b-old" d="M0 0" stroke="#ff2e97" stroke-width="5" stroke-opacity="0.45"/>';
            s += '<path class="f06-b-core" d="M0 0" stroke="#ffd9ec" stroke-width="2.2" stroke-opacity="0.5"/>';
            return s + "</g></svg>";
          }
          document.getElementById("f06-world-main").innerHTML = world("f06-bloom");
          document.getElementById("f06-world-lens").innerHTML = world("f06-bloom-lens");

          var rows = root.querySelectorAll(".f06-hl");
          function setGrid(phase) {
            for (var i = 0; i < rows.length; i++) { var y = K.gridRowY(i % NH, phase, HZ, FH); y = y > 1590 ? 1600 : y; rows[i].setAttribute("y1", y); rows[i].setAttribute("y2", y); }
          }
          // floor phase (cells): x4 rush (8/s) through the fly-by, eases to x1 (one cell per beat) as the device lands
          function phaseAt(t) {
            if (t <= 1.7) return 8 * t;
            if (t <= 2.1) { var u = t - 1.7; return 13.6 + 8 * u - 7.5 * u * u; }
            return 15.6 + 2 * (t - 2.1);
          }

          // the beam lies across the floor as a PCB-routed trace (lateral runs joined by 45-degree jogs), in floor
          // coords (i = radial-line index, Z = depth in cells). The camera dollies over the floor toward it; the
          // projection matches gridRowY (depth zz = 3.2 + Z - phase), so it rides the scrolling rows exactly.
          var RUNS = [7, 4, 6, 3, 5, 8, 4, 6, 3, 5, 7, 4, 6, 5, 3, 6, 8, 4, 5, 6, 4, 7];
          var TR = [], ti = -64, tz = 22.2;
          RUNS.forEach(function (r, n) { TR.push([ti, tz]); ti += r; TR.push([ti, tz]); var j = n % 2 ? -0.8 : 0.8; ti += 0.8; tz += j; });
          function tracePts(phase) {
            return TR.map(function (q) { var zz = 3.2 + q[1] - phase; return [960 + (600 * q[0]) / zz, HZ + FH / zz]; });
          }
          function dOf(p) { return "M" + p.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L"); }
          // 720: the trace lifts off the floor and pulls taut into one straight line (jogs flatten, x kept)
          var P0 = tracePts(phaseAt(4));
          var beams = root.querySelectorAll(".f06-b-old, .f06-b-core");
          function setBeam(t) {
            var p;
            if (t < 4) p = tracePts(phaseAt(t));
            else {
              var m = t >= 4.4 ? 1 : 1 - Math.pow(2, (-10 * (t - 4)) / 0.4);
              p = P0.map(function (q) { return [q[0], q[1] + (YS - q[1]) * m]; });
            }
            var d = dOf(p);
            for (var i = 0; i < beams.length; i++) beams[i].setAttribute("d", d);
          }

          // fly-by captures: flat Tier B frames at fixed world offsets; the camera's approach scales them by
          // s = 1 / (1 + 2 (tPass - t)): ~0.4 when they power on, 1 as they pass (615, 630, 645), 4 as they leave.
          var CARDS = [
            { pass: 0.5, px: -540, py: -250, rot: -4 },
            { pass: 1.0, px: 540, py: -290, rot: 3 },
            { pass: 1.5, px: -560, py: 70, rot: 4 },
          ];
          var CHIP = K.spring(0.45, 0.8, 0.7);
          CARDS.forEach(function (c, i) {
            defs.insertAdjacentHTML("beforeend", K.lensFilter("f06-c" + i + "-f", { w: 640, h: 420, r: 34, bezel: 30, dir: -1, power: 1.6 }));
            c.f = document.getElementById("f06-c" + i + "-f");
            c.el = document.getElementById("f06-c" + i);
            c.on = Math.max(0.033, c.pass - 0.8);
          });
          function setCards(t) {
            CARDS.forEach(function (c) {
              var s = 1 / (1 + 2 * (c.pass - t)), live = t >= c.on && t < c.pass + 0.375;
              c.el.style.opacity = live ? Math.min(1, (t - c.on) / 0.1).toFixed(3) : "0";
              if (!live) return;
              c.el.style.transform = "translate(" + (c.px * s).toFixed(1) + "px," + (c.py * s).toFixed(1) + "px) rotate(" + c.rot + "deg) scale(" + s.toFixed(4) + ")";
              K.setRefraction(c.f, 48 * CHIP(Math.min(1, (t - c.on) / 0.7)));
            });
          }

          var stage = document.getElementById("f06-stage");
          var grain = document.getElementById("f06-grain");
          grain.style.backgroundImage = K.grainURL(1337);
          setGrid(0);
          setBeam(0);
          setCards(0);

          var tl = gsap.timeline({ paused: true });
          // ambient: floor, beam on the floor, fly-by cards, grain
          var amb = { t: 0 };
          tl.to(amb, { t: 6, duration: 6, ease: "none", onUpdate: function () {
            var t = amb.t;
            setGrid(phaseAt(t));
            setBeam(t);
            setCards(t);
            grain.style.backgroundPosition = K.grainPos(t);
          } }, 0);
          tl.fromTo(root.querySelectorAll(".f06-haze"), { opacity: 0.75 }, { opacity: 1, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);

          // 600 dolly in: scale 0.8 -> 1 out of the vanishing point (12 f, expo.out), floor already at x4
          tl.fromTo(stage, { scale: 0.8, transformOrigin: "960px 690px" }, { scale: 1, duration: 0.4, ease: "expo.out" }, 0);

          // each capture powers on like a tube as it appears: dot -> line -> frame, flash, scanlines fade off
          CARDS.forEach(function (c) {
            var shot = c.el.querySelector(".f06-shot");
            tl.fromTo(shot, { scaleX: 0.02, scaleY: 0.006 }, { scaleX: 1, duration: 0.12, ease: "power4.out" }, c.on);
            tl.to(shot, { scaleY: 1, duration: 0.24, ease: "expo.out" }, c.on + 0.12);
            tl.fromTo(c.el.querySelector(".f06-flash"), { opacity: 0.95 }, { opacity: 0, duration: 0.36, ease: "power2.out" }, c.on + 0.12);
            tl.fromTo(c.el.querySelector(".f06-scan"), { opacity: 0.9 }, { opacity: 0, duration: 0.7, ease: "power2.in" }, c.on + 0.12);
            tl.fromTo(c.el.querySelector(".lg-rim"), { "--spec": "60deg" }, { "--spec": "200deg", duration: 1.0, ease: "power3.out" }, c.on);
          });

          // 660 the hero device condenses (Tier H: refraction spring, skin up, rim light sweeps; no move, no scale)
          var GLASS = K.spring(0.55, 0.62, 1.2);
          var lens = { k: 0 };
          tl.set("#f06-device", { opacity: 1 }, 2.0);
          tl.to(lens, { k: 1, duration: 1.2, ease: GLASS, onUpdate: function () { K.setRefraction(lensF, 112 * lens.k); } }, 2.0);
          tl.to(root.querySelectorAll(".f06-skin"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.0);
          tl.fromTo("#f06-rim", { "--spec": "110deg" }, { "--spec": "210deg", duration: 1.6, ease: "power3.out" }, 2.0);
          tl.to("#f06-rim", { "--spec": "250deg", duration: 2.4, ease: "sine.inOut" }, 3.6);
          // 663 the UEM capture powers on inside it, then scrolls at 75 px/s
          tl.set("#f06-screen", { opacity: 1 }, 2.1);
          tl.fromTo("#f06-screen", { scaleX: 0.02, scaleY: 0.006 }, { scaleX: 1, duration: 0.12, ease: "power4.out" }, 2.1);
          tl.to("#f06-screen", { scaleY: 1, duration: 0.24, ease: "expo.out" }, 2.22);
          tl.fromTo("#f06-flash", { opacity: 0.95 }, { opacity: 0, duration: 0.36, ease: "power2.out" }, 2.22);
          tl.fromTo("#f06-scan", { opacity: 0.9 }, { opacity: 0, duration: 0.7, ease: "power2.in" }, 2.22);
          tl.fromTo("#f06-uem", { y: 0 }, { y: -142, duration: 1.9, ease: "none" }, 2.1);

          // 662 marker types (the arrow is drawn, it counts as one character), caret blinks then goes dark
          var M1 = "2024", M2 = "NOW · PRODUCT DESIGNER, MINIORANGE · PUNE", NM = M1.length + 1 + M2.length;
          var m1 = document.getElementById("f06-m1"), m2 = document.getElementById("f06-m2"), arrow = root.querySelector("#f06-marker svg");
          var mk = { n: 0 };
          tl.to(mk, { n: NM, duration: 28 / 30, ease: "steps(" + NM + ")", onUpdate: function () {
            var n = Math.round(mk.n);
            m1.textContent = M1.slice(0, n);
            arrow.style.opacity = n > M1.length ? 1 : 0;
            m2.textContent = M2.slice(0, Math.max(0, n - M1.length - 1));
          } }, 62 / 30);
          tl.set("#f06-caret1", { opacity: 1 }, 62 / 30);
          tl.to("#f06-caret1", { opacity: 0, duration: 0.2, ease: "steps(1)", repeat: 5, yoyo: true }, 3.0);
          tl.set("#f06-caret1", { opacity: 0 }, 4.22);

          // 675 his statement wipes on (two lines, the second an eighth behind)
          tl.to("#f06-l1", { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, 2.5);
          tl.to("#f06-l2", { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, 2.6);

          // 720 the stab: the beam is pulled taut (setBeam), thins to one 2 px stroke and burns to its core;
          // the device screen cuts to the MODS docs with a short re-power
          tl.to(root.querySelectorAll(".f06-b-old"), { attr: { "stroke-width": 2 }, duration: 0.4, ease: "expo.out" }, 4.0);
          tl.to(root.querySelectorAll(".f06-b-core"), { attr: { "stroke-width": 2 }, strokeOpacity: 1, duration: 0.4, ease: "expo.out" }, 4.0);
          tl.set("#f06-uem", { opacity: 0 }, 4.0);
          tl.set("#f06-mods", { opacity: 1 }, 4.0);
          tl.fromTo("#f06-screen", { scaleY: 0.006 }, { scaleY: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, 4.0);
          tl.fromTo("#f06-flash", { opacity: 0.8 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 4.0);
          tl.fromTo("#f06-scan", { opacity: 0.9 }, { opacity: 0, duration: 0.6, ease: "power2.in", immediateRender: false }, 4.0);
          tl.fromTo("#f06-mods", { y: 0 }, { y: -150, duration: 2, ease: "none" }, 4.0);
