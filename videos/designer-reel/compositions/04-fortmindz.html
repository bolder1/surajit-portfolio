<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- F4 "Fortmindz, 2022" (film 360-480, 4 s). The camera rides the beam to the right like stations on
         one long canvas: the beam threads a checkout flow through four Tier B chips while product-page
         wireframes slide past. Local time = film frame - 360. Needs window.ReelKit (assets/lib/reel-kit.js). -->
  </head>
  <body>
    <template id="f04-template">
      <style>
        @font-face { font-family: "Mona Sans"; src: url("assets/fonts/MonaSans-var.woff2") format("woff2"); font-weight: 200 900; font-stretch: 75% 125%; }
        @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-normal.woff2") format("woff2"); font-weight: 100 800; }
        #f04-root { position: absolute; inset: 0; overflow: hidden; background: #0b0716; }
        #f04-stage { position: absolute; inset: 0; }
        .f04-layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        .f04-layer > svg, #f04-haze { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #f04-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 74% at 50% 50%, rgba(7, 4, 16, 0) 58%, rgba(7, 4, 16, 0.72) 100%); }
        .f04-tag { position: absolute; font: 500 22px/1 "JetBrains Mono", monospace; letter-spacing: 0.14em; color: #8c7eb8; white-space: nowrap; }

        /* type */
        #f04-marker { position: absolute; left: 120px; top: 176px; font: 500 24px/1 "JetBrains Mono", monospace; letter-spacing: 0.14em; color: #b4a8da; white-space: nowrap; }
        #f04-caret { display: inline-block; width: 0.6em; height: 1em; margin-left: 6px; vertical-align: -0.12em; background: #ff2e97; opacity: 0; }
        #f04-quote { position: absolute; left: 120px; top: 896px; font-family: "Mona Sans", sans-serif; font-size: 44px; line-height: 1.2; font-variation-settings: "wdth" 100, "wght" 380; color: #f3eeff; white-space: nowrap; clip-path: inset(0 100% 0 0); }

        /* Tier B liquid glass chips (backdrop-filter, inward rim); the beam runs under their bottom rim */
        .f04-chip { position: absolute; height: 80px; border-radius: 40px; box-shadow: 0 24px 40px -20px rgba(7, 4, 16, 0.9); opacity: 0; }
        #f04-chip-cart { backdrop-filter: url(#f04-cart-f); }
        #f04-chip-address { backdrop-filter: url(#f04-address-f); }
        #f04-chip-pay { backdrop-filter: url(#f04-pay-f); }
        #f04-chip-done { backdrop-filter: url(#f04-done-f); }
        .f04-chip .lg-tint { background: rgba(20, 12, 38, 0.42); }
        .f04-chip-text { position: absolute; inset: 0 0 4px 0; display: flex; align-items: center; justify-content: center; font: 500 26px/1 "JetBrains Mono", monospace; letter-spacing: 0.14em; color: #f3eeff; white-space: nowrap; padding-left: 0.14em; }
        #f04-done-run { position: absolute; left: -24px; top: -24px; width: 228px; height: 128px; overflow: visible; }
        .lg-tint { position: absolute; inset: 0; border-radius: inherit; }
        .lg-shade { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 2px 1px -1px rgba(255, 255, 255, 0.7), inset 0 26px 40px -30px rgba(255, 255, 255, 0.35), inset 0 -34px 54px -34px rgba(34, 230, 255, 0.28), inset 0 0 36px rgba(255, 255, 255, 0.05), inset 0 0 0 1px rgba(243, 238, 255, 0.1); }
        .lg-rim { position: absolute; inset: 0; border-radius: inherit; padding: 2px; --spec: 150deg; background: conic-gradient(from var(--spec), rgba(255, 255, 255, 0.95) 0deg, rgba(255, 255, 255, 0.18) 46deg, rgba(255, 255, 255, 0) 90deg, rgba(255, 46, 151, 0.7) 168deg, rgba(255, 255, 255, 0) 214deg, rgba(34, 230, 255, 0.45) 300deg, rgba(255, 255, 255, 0.95) 360deg); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

        #f04-grain { position: absolute; inset: 0; opacity: 0.1; mix-blend-mode: overlay; }
      </style>

      <div id="f04-root" data-composition-id="f04" data-width="1920" data-height="1080" data-duration="4">
        <div id="f04-scene" class="clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="f04-stage">
            <svg id="f04-haze" viewBox="0 0 1920 1080" aria-hidden="true">
              <defs>
                <radialGradient id="f04-haze-g" cx="960" cy="690" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 690) scale(1150 330) translate(-960 -690)">
                  <stop offset="0" stop-color="#3b1e6e" stop-opacity="0.85" /><stop offset="0.45" stop-color="#3b1e6e" stop-opacity="0.32" /><stop offset="1" stop-color="#3b1e6e" stop-opacity="0" />
                </radialGradient>
              </defs>
              <rect id="f04-haze-r" x="-200" y="200" width="2320" height="980" fill="url(#f04-haze-g)" />
            </svg>
            <!-- far layer (x0.55): a product page wireframe; near layer (x0.75): an app checkout screen. Outlines only. -->
            <div class="f04-layer" id="f04-web" data-layout-allow-overflow>
              <div class="f04-tag" style="left: 692px; top: 264px" data-layout-allow-occlusion>WEBSITES</div>
              <svg viewBox="0 0 1920 1080" aria-hidden="true">
                <g transform="translate(692 300)" fill="none" stroke="#4a2c8c" stroke-width="1.5" stroke-linecap="round">
                  <rect x="0" y="0" width="1000" height="360" rx="14" /><path d="M0 56 H1000" /><rect x="28" y="19" width="56" height="18" rx="4" />
                  <path d="M420 28 H480 M504 28 H564 M588 28 H648" /><rect x="930" y="17" width="40" height="22" rx="5" />
                  <rect x="32" y="84" width="360" height="248" rx="8" /><path d="M32 84 L392 332 M392 84 L32 332" stroke-opacity="0.5" />
                  <path d="M430 106 H820 M430 138 H700 M430 186 H530" />
                  <rect x="430" y="214" width="64" height="36" rx="18" /><rect x="506" y="214" width="64" height="36" rx="18" /><rect x="582" y="214" width="64" height="36" rx="18" />
                  <rect x="430" y="276" width="280" height="56" rx="28" /><rect x="730" y="276" width="56" height="56" rx="28" />
                </g>
              </svg>
            </div>
            <div class="f04-layer" id="f04-app" data-layout-allow-overflow>
              <div class="f04-tag" style="left: 2240px; top: 204px" data-layout-allow-occlusion>APPS</div>
              <svg viewBox="0 0 1920 1080" aria-hidden="true">
                <g transform="translate(2240 240)" fill="none" stroke="#4a2c8c" stroke-width="1.5" stroke-linecap="round">
                  <rect x="0" y="0" width="300" height="600" rx="46" /><rect x="116" y="18" width="68" height="14" rx="7" /><path d="M28 70 H160" />
                  <rect x="28" y="94" width="244" height="204" rx="14" /><path d="M28 94 L272 298 M272 94 L28 298" stroke-opacity="0.5" />
                  <path d="M28 330 H232 M28 360 H164 M28 400 H108" /><rect x="178" y="382" width="94" height="36" rx="18" />
                  <rect x="28" y="458" width="244" height="60" rx="30" /><path d="M0 542 H300" />
                  <rect x="42" y="560" width="22" height="22" rx="6" /><rect x="108" y="560" width="22" height="22" rx="6" /><rect x="172" y="560" width="22" height="22" rx="6" /><rect x="236" y="560" width="22" height="22" rx="6" />
                </g>
              </svg>
            </div>
            <div class="f04-layer" id="f04-track" data-layout-allow-overflow><svg id="f04-beam" viewBox="0 0 1920 1080" aria-hidden="true"></svg></div>
            <div id="f04-vignette" data-layout-ignore></div>
            <div class="f04-layer" id="f04-chips" data-layout-allow-overflow>
              <div class="f04-chip" id="f04-chip-cart"><div class="lg-tint"></div><div class="lg-shade"></div><div class="lg-rim"></div><div class="f04-chip-text">CART</div></div>
              <div class="f04-chip" id="f04-chip-address"><div class="lg-tint"></div><div class="lg-shade"></div><div class="lg-rim"></div><div class="f04-chip-text">ADDRESS</div></div>
              <div class="f04-chip" id="f04-chip-pay"><div class="lg-tint"></div><div class="lg-shade"></div><div class="lg-rim"></div><div class="f04-chip-text">PAY</div></div>
              <div class="f04-chip" id="f04-chip-done"><div class="lg-tint"></div><div class="lg-shade"></div><div class="lg-rim"></div><div class="f04-chip-text">DONE</div>
                <!-- adapted lt-neon-border: one light runs once around the chip edge (stacked bloom, beam -> beam-core -> white) -->
                <svg id="f04-done-run" viewBox="0 0 228 128" aria-hidden="true">
                  <g fill="none" stroke-linecap="round" filter="url(#f04-run-glow)">
                    <path class="f04-run" d="" stroke="#ff2e97" stroke-width="7" />
                    <path class="f04-run" d="" stroke="#ffd9ec" stroke-width="2.6" />
                    <path class="f04-run f04-run-hot" d="" stroke="#ffffff" stroke-width="1.4" />
                    <path id="f04-done-lit" d="" stroke="#ff2e97" stroke-width="2" opacity="0" />
                  </g>
                </svg>
              </div>
            </div>
            <div id="f04-marker"><span id="f04-marker-text"></span><span id="f04-caret"></span></div>
            <div id="f04-quote">Learned to ship on a deadline alongside developers.</div>
          </div>
          <div id="f04-grain" data-layout-ignore></div>

          <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs id="f04-defs">
              <filter id="f04-bloom" x="-960" y="540" width="4460" height="400" filterUnits="userSpaceOnUse">
                <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1" /><feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2" />
                <feMerge><feMergeNode in="b2" /><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
              <filter id="f04-run-glow" x="-20" y="-20" width="268" height="168" filterUnits="userSpaceOnUse">
                <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b1" /><feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b2" />
                <feMerge><feMergeNode in="b2" /><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
            </defs>
          </svg>
        </div>
      </div>

      <script>
        (function () {
          var K = window.ReelKit;
          var root = document.getElementById("f04-root");
          var defs = document.getElementById("f04-defs");

          // stations in world space (the track layer pans 1:1 with the camera), 440 px apart. Rails climb 90 px
          // per 45-degree step; each rail runs 24 px below the chip's centre, through its bottom rim band.
          // The route enters at y 880 (F3's exit) and DONE's rail is y 610, where it leaves for F5.
          var CH = 80;
          var CHIPS = [
            { id: "cart", cx: 900, w: 180, rail: 880, beat: 0.5 },
            { id: "address", cx: 1340, w: 236, rail: 790, beat: 1.0 },
            { id: "pay", cx: 1780, w: 160, rail: 700, beat: 1.5 },
            { id: "done", cx: 2220, w: 180, rail: 610, beat: 2.0 },
          ];
          var pts = [[-900, 880]];
          CHIPS.forEach(function (c, i) {
            c.left = c.cx - c.w / 2;
            c.pad = c.left - 34;
            var el = document.getElementById("f04-chip-" + c.id);
            el.style.left = c.left + "px";
            el.style.top = c.rail - 24 - CH / 2 + "px";
            el.style.width = c.w + "px";
            defs.insertAdjacentHTML("beforeend", K.lensFilter("f04-" + c.id + "-f", { w: c.w, h: CH, r: 40, bezel: 34, dir: -1, power: 1.6 }));
            c.f = document.getElementById("f04-" + c.id + "-f");
            c.el = el;
            var nx = CHIPS[i + 1];
            if (nx) {
              var x = c.cx + c.w / 2 + 24;
              pts.push([x, c.rail], [x + (c.rail - nx.rail), nx.rail]);
            }
          });
          pts.push([3400, 610]);
          var d = "M " + pts.map(function (p) { return p[0] + " " + p[1]; }).join(" L ");
          // arc length of each pad along the route (polyline, so exact)
          function sAt(x, y) {
            var s = 0;
            for (var i = 1; i < pts.length; i++) {
              var a = pts[i - 1], b = pts[i];
              if (b[1] === y && a[1] === y && x >= a[0] && x <= b[0]) return s + (x - a[0]);
              s += Math.hypot(b[0] - a[0], b[1] - a[1]);
            }
            return s;
          }
          var bs = '<g filter="url(#f04-bloom)" fill="none" stroke-linecap="round" stroke-linejoin="round">';
          bs += '<path class="f04-b-old" d="' + d + '" stroke="#ff2e97" stroke-width="5" stroke-opacity="0.5"/>';
          bs += '<path class="f04-b-fresh" d="' + d + '" stroke="#ff2e97" stroke-width="6"/>';
          bs += '<path class="f04-b-core" d="' + d + '" stroke="#ffd9ec" stroke-width="2.2"/>';
          bs += '<path class="f04-b-head" d="' + d + '" stroke="#ffffff" stroke-width="7"/>';
          CHIPS.forEach(function (c) {
            c.s = sAt(c.pad, c.rail);
            bs += '<circle id="f04-pad-' + c.id + '" cx="' + c.pad + '" cy="' + c.rail + '" r="11" stroke="#ff2e97" stroke-width="3.5" fill="#0b0716"/>';
          });
          document.getElementById("f04-beam").innerHTML = bs + "</g>";

          var LEN = Math.ceil(root.querySelector(".f04-b-old").getTotalLength()) + 2;
          var drawn = root.querySelectorAll(".f04-b-old, .f04-b-core"),
            fresh = root.querySelectorAll(".f04-b-fresh"),
            head = root.querySelectorAll(".f04-b-head");
          function setBeam(s) {
            K.dash(drawn, LEN, s, null);
            K.dash(fresh, LEN, s, 560);
            K.dash(head, LEN, s, 70);
          }

          // DONE rim light path: the chip's own rounded rect, offset into the run svg (24 px margin)
          var dw = CHIPS[3].w, rr = 39;
          var rp = "M " + (24 + rr) + " 25 H " + (24 + dw - rr) + " A " + rr + " " + rr + " 0 0 1 " + (24 + dw - rr) + " " + (25 + 2 * rr) + " H " + (24 + rr) + " A " + rr + " " + rr + " 0 0 1 " + (24 + rr) + " 25 Z";
          var runs = root.querySelectorAll(".f04-run");
          runs.forEach(function (p) { p.setAttribute("d", rp); });
          document.getElementById("f04-done-lit").setAttribute("d", rp);
          var RUNLEN = runs[0].getTotalLength();
          function setRun(u, a) {
            var seg = RUNLEN * 0.26;
            runs.forEach(function (p, i) {
              var sg = i === 2 ? seg * 0.5 : seg;
              p.style.strokeDasharray = sg + " " + (RUNLEN + 10);
              p.style.strokeDashoffset = sg - u * (RUNLEN + seg);
              p.style.opacity = a;
            });
          }
          setRun(0, 0);

          // camera: whip in (x 400 -> 0, blur 24 -> 0, 9 f expo.out) over a 520 px/s ride; hard stop on DONE,
          // hold, then accelerate after the fired beam into F5 (600 px/s = 20 px/f leftward at the cut).
          function pan(t) {
            if (t <= 1.9) return 520 * t;
            if (t <= 2.2) { var u = (t - 1.9) / 0.3; return 988 + 52 * (1 - Math.pow(1 - u, 3)); }
            if (t <= 11 / 3) return 1040;
            var v = t - 11 / 3;
            return 1040 + 900 * v * v;
          }
          function whip(t) { return t >= 0.3 ? 0 : Math.pow(2, (-10 * t) / 0.3); }
          var stage = document.getElementById("f04-stage");
          var LAYERS = [[document.getElementById("f04-web"), 0.55], [document.getElementById("f04-app"), 0.75], [document.getElementById("f04-track"), 1], [document.getElementById("f04-chips"), 1]];
          var grain = document.getElementById("f04-grain");
          grain.style.backgroundImage = K.grainURL(1337);
          function setCam(t) {
            var w = whip(t), cx = 400 * w - pan(t);
            for (var i = 0; i < LAYERS.length; i++) LAYERS[i][0].style.transform = "translate3d(" + (cx * LAYERS[i][1]).toFixed(2) + "px,0,0)";
            stage.style.filter = w > 0.002 ? "blur(" + (24 * w).toFixed(2) + "px)" : "none";
            grain.style.backgroundPosition = K.grainPos(t);
          }
          var MARK = "2022 · KOLKATA · UX/UI DESIGNER, FORTMINDZ";
          var markEl = document.getElementById("f04-marker-text");
          setBeam(1000);
          setCam(0);

          var tl = gsap.timeline({ paused: true });
          var amb = { t: 0 };
          tl.to(amb, { t: 4, duration: 4, ease: "none", onUpdate: function () { setCam(amb.t); } }, 0);
          tl.fromTo("#f04-haze-r", { opacity: 0.75 }, { opacity: 1, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

          // the head threads the flow: decelerates into each pad on the beat (375, 390, 405, 420), fires on
          var b = { s: 1000 };
          var CHIP = K.spring(0.45, 0.8, 0.7);
          CHIPS.forEach(function (c, i) {
            var t0 = i === 0 ? 0 : CHIPS[i - 1].beat;
            tl.to(b, { s: c.s, duration: c.beat - t0, ease: "power2.out", onUpdate: function () { setBeam(b.s); } }, t0);
            tl.fromTo("#f04-pad-" + c.id, { scale: 0, svgOrigin: c.pad + " " + c.rail }, { scale: 1, duration: 0.18, ease: "power4.out" }, c.beat - 0.05);
            // chip snaps in on the CHIP spring; its inward rim refraction ramps with it
            var k = { v: 0 };
            tl.fromTo(c.el, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.7, ease: CHIP }, c.beat);
            tl.to(k, { v: 1, duration: 0.7, ease: CHIP, onUpdate: function () { K.setRefraction(c.f, 46 * k.v); } }, c.beat);
            tl.fromTo(c.el.querySelector(".lg-rim"), { "--spec": "60deg" }, { "--spec": "200deg", duration: 1.0, ease: "power3.out" }, c.beat);
          });
          // 420 hard stop on DONE: head goes out, the fresh trail decays to phosphor
          tl.to(head, { strokeOpacity: 0, duration: 0.12, ease: "power1.out" }, 2.0);
          tl.to(fresh, { strokeOpacity: 0.6, duration: 0.6, ease: "power2.out" }, 2.0);
          // 420 DONE lights: one light runs once around its edge
          var run = { u: 0 };
          tl.to(run, { u: 1, duration: 0.75, ease: "power2.inOut", onUpdate: function () { setRun(run.u, run.u < 0.85 ? 1 : (1 - run.u) / 0.15); } }, 2.0);
          // ...and the edge stays lit (phosphor persistence) to mark the finished state
          tl.fromTo("#f04-done-lit", { opacity: 0 }, { opacity: 0.55, duration: 0.3, ease: "power2.out" }, 2.6);

          // 372 marker types (steps), caret blinks in eighths, then goes dark
          var mk = { n: 0 };
          tl.to(mk, { n: MARK.length, duration: 2 / 3, ease: "steps(" + MARK.length + ")", onUpdate: function () { markEl.textContent = MARK.slice(0, Math.round(mk.n)); } }, 0.4);
          tl.set("#f04-caret", { opacity: 1 }, 0.4);
          tl.to("#f04-caret", { opacity: 0, duration: 0.25, ease: "steps(1)", repeat: 5, yoyo: true }, 1.0667);
          tl.set("#f04-caret", { opacity: 0 }, 2.6);

          // 435 his line wipes on
          tl.to("#f04-quote", { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, 2.5);

          // 470 the beam fires on to the right (launch) and leaves the frame at y 610; the camera follows
          tl.set(head, { strokeOpacity: 1 }, 11 / 3);
          tl.set(fresh, { strokeOpacity: 1 }, 11 / 3);
          tl.to(b, { s: LEN, duration: 0.3, ease: "power2.in", onUpdate: function () { setBeam(b.s); } }, 11 / 3);

          window.__timelines["f04"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
