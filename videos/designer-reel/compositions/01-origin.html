<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- F1 "Where the line starts" · film frames 0-120 (4 s, local t = film frame / 30).
         The tube powers on, a scope graticule draws, and one beam routes a PCB trace that solders
         two Tier B year chips onto its pads. At 120 the head is still running: 02-thesis.html
         continues the same path, timing function and world (match cut). Needs window.ReelKit. -->
  </head>
  <body>
    <template id="f01-template">
      <style>
        @font-face {
          font-family: "JetBrains Mono";
          src: url("assets/fonts/JetBrainsMono-normal.woff2") format("woff2");
          font-weight: 100 800;
        }
        #f01-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #070410;
        }
        #f01-tube {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0b0716;
        }
        #f01-world {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          overflow: visible;
        }
        #f01-scan {
          position: absolute;
          inset: 0;
          opacity: 0;
          background: repeating-linear-gradient(180deg, rgba(7, 4, 16, 0.55) 0 1px, rgba(7, 4, 16, 0) 1px 3px);
        }
        #f01-flash {
          position: absolute;
          inset: 0;
          opacity: 0;
          background: #ffd9ec;
        }
        #f01-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 78% 74% at 50% 50%, rgba(7, 4, 16, 0) 58%, rgba(7, 4, 16, 0.72) 100%);
        }
        /* Tier B year chips hang on the riser after their pad: the riser crosses the left cap off-centre,
           so the inward lens bends it sideways (a visible kink), not just along its own length */
        .f01-chip {
          position: absolute;
          height: 76px;
          border-radius: 38px;
          box-shadow: 0 24px 40px -20px rgba(7, 4, 16, 0.9);
          opacity: 0;
          visibility: hidden;
          transform-origin: 27px 38px;
        }
        #f01-chip1 {
          left: 405px;
          top: 710px;
          width: 552px;
          backdrop-filter: url(#f01-chip1-f);
        }
        #f01-chip2 {
          left: 1125px;
          top: 678px;
          width: 699px;
          backdrop-filter: url(#f01-chip2-f);
        }
        .f01-tint,
        .f01-shade,
        .f01-rim {
          position: absolute;
          inset: 0;
          border-radius: inherit;
        }
        .f01-tint {
          background: rgba(20, 12, 38, 0.42);
        }
        .f01-shade {
          box-shadow:
            inset 0 2px 1px -1px rgba(255, 255, 255, 0.7),
            inset 0 26px 40px -30px rgba(255, 255, 255, 0.35),
            inset 0 -34px 54px -34px rgba(34, 230, 255, 0.28),
            inset 0 0 36px rgba(255, 255, 255, 0.05),
            inset 0 0 0 1px rgba(243, 238, 255, 0.1);
        }
        .f01-rim {
          padding: 2px;
          --spec: 60deg;
          background: conic-gradient(
            from var(--spec),
            rgba(255, 255, 255, 0.95) 0deg,
            rgba(255, 255, 255, 0.18) 46deg,
            rgba(255, 255, 255, 0) 90deg,
            rgba(255, 46, 151, 0.7) 168deg,
            rgba(255, 255, 255, 0) 214deg,
            rgba(34, 230, 255, 0.45) 300deg,
            rgba(255, 255, 255, 0.95) 360deg
          );
          -webkit-mask:
            linear-gradient(#000 0 0) content-box,
            linear-gradient(#000 0 0);
          -webkit-mask-composite: xor;
          mask-composite: exclude;
        }
        .f01-ctext {
          position: absolute;
          left: 57px;
          top: 0;
          height: 76px;
          display: flex;
          align-items: center;
          font: 500 22px/1 "JetBrains Mono", monospace;
          letter-spacing: 0.14em;
          color: #b4a8da;
          white-space: nowrap;
        }
        .f01-ctext span {
          white-space: pre;
        }
        .f01-yr {
          color: #f3eeff;
        }
        .f01-caret {
          display: inline-block;
          width: 0.6em;
          height: 1em;
          margin-left: 4px;
          background: #ff2e97;
          opacity: 0;
        }
        #f01-grain {
          position: absolute;
          inset: 0;
          opacity: 0.1;
          mix-blend-mode: overlay;
        }
      </style>

      <div id="f01-root" data-composition-id="f01" data-width="1920" data-height="1080" data-duration="4">
        <div id="f01-scene" class="clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="f01-tube">
            <svg id="f01-world" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" data-layout-allow-overflow></svg>
            <div id="f01-scan" data-layout-ignore></div>
            <div id="f01-flash" data-layout-ignore></div>
          </div>
          <div id="f01-vignette" data-layout-ignore></div>

          <div class="f01-chip" id="f01-chip1">
            <div class="f01-tint"></div>
            <div class="f01-shade"></div>
            <div class="f01-rim"></div>
            <div class="f01-ctext"><span class="f01-yr"></span><span class="f01-rest"></span><span class="f01-caret"></span></div>
          </div>
          <div class="f01-chip" id="f01-chip2">
            <div class="f01-tint"></div>
            <div class="f01-shade"></div>
            <div class="f01-rim"></div>
            <div class="f01-ctext"><span class="f01-yr"></span><span class="f01-rest"></span><span class="f01-caret"></span></div>
          </div>

          <div id="f01-grain" data-layout-ignore></div>
          <svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs id="f01-defs"></defs></svg>
        </div>
      </div>

      <script>
        (function () {
          var K = window.ReelKit;
          var root = document.getElementById("f01-root");
          var defs = document.getElementById("f01-defs");
          function F(f) { return f / 30; } // film frame -> local seconds (F1 starts at film 0)

          // The route (shared verbatim with 02-thesis.html): 90° PCB bends with 45° mitres, four equal
          // 413.25 px legs so pads land on beats 45/60/75/90 at a constant 826.5 px/s. After pad D the head
          // decelerates (power2.out over 1.5 s) and stops at E in F2 (film 135); F2 draws E -> F.
          var PATH = "M 18.75 828 H 432 V 668 L 464 636 H 672 V 476 L 704 444 H 912 V 604 L 944 636 H 1152 V 796 L 1184 828 H 1776 L 1808 796 V 540";
          var PADS = [[432, 828], [672, 636], [912, 444], [1152, 636]];
          var V = 826.5, SD = 1653, R = 620.25;
          function headAt(t) {
            if (t < 1) return 0;
            if (t < 3) return V * (t - 1);
            var p = Math.min((t - 3) / 1.5, 1);
            return SD + R * (1 - (1 - p) * (1 - p));
          }

          // world: haze, scope graticule (10 x 192 px divisions, ticked cyan centre axes), beam, pads
          var s = "<defs>";
          s += '<radialGradient id="f01-haze-g" cx="960" cy="600" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 600) scale(1150 380) translate(-960 -600)">';
          s += '<stop offset="0" stop-color="#3b1e6e" stop-opacity="0.85"/><stop offset="0.45" stop-color="#3b1e6e" stop-opacity="0.32"/><stop offset="1" stop-color="#3b1e6e" stop-opacity="0"/></radialGradient>';
          s += '<filter id="f01-bloom" x="-45" y="380" width="1890" height="520" filterUnits="userSpaceOnUse"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1"/><feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2"/><feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
          s += '<clipPath id="f01-axclip"><rect id="f01-axh" x="960" y="520" width="0" height="40"/><rect id="f01-axv" x="940" y="540" width="40" height="0"/></clipPath></defs>';
          s += '<rect id="f01-haze" x="-200" y="100" width="2320" height="1100" fill="url(#f01-haze-g)"/>';
          s += '<g stroke="#4a2c8c" stroke-opacity="0.35" stroke-width="1.5" fill="none">';
          [348, 732, 156, 924].forEach(function (y) {
            s += '<line class="f01-gl" data-r="' + Math.abs(y - 540) / 192 + '" x1="0" y1="' + y + '" x2="1920" y2="' + y + '" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>';
          });
          for (var i = 1; i <= 9; i++) {
            if (i !== 5) s += '<line class="f01-gl" data-r="' + Math.abs(i - 5) + '" x1="' + i * 192 + '" y1="0" x2="' + i * 192 + '" y2="1080" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>';
          }
          s += '</g><g clip-path="url(#f01-axclip)" stroke="#22e6ff" stroke-opacity="0.42" stroke-width="1.6" fill="none"><path d="M0 540H1920M960 0V1080';
          for (var x = 0; x <= 1920; x += 48) s += "M" + x + " " + (540 - (x % 192 ? 4 : 9)) + "V" + (540 + (x % 192 ? 4 : 9));
          for (var y = 12; y <= 1068; y += 48) s += "M" + (960 - ((y - 540) % 192 ? 4 : 9)) + " " + y + "H" + (960 + ((y - 540) % 192 ? 4 : 9));
          s += '"/></g><g id="f01-beam" opacity="0" filter="url(#f01-bloom)" fill="none" stroke-linecap="round" stroke-linejoin="round">';
          s += '<path class="f01-old" d="' + PATH + '" stroke="#ff2e97" stroke-width="5" stroke-opacity="0.5"/>';
          s += '<path class="f01-fresh" d="' + PATH + '" stroke="#ff2e97" stroke-width="6"/>';
          s += '<path class="f01-core" d="' + PATH + '" stroke="#ffd9ec" stroke-width="2.2"/>';
          s += '<path class="f01-head" d="' + PATH + '" stroke="#ffffff" stroke-width="7"/>';
          s += '<circle id="f01-spark" cx="18.75" cy="828" r="7" fill="#ffd9ec" stroke="none" opacity="0"/>';
          PADS.forEach(function (p, n) {
            s += '<circle id="f01-pad' + n + '" cx="' + p[0] + '" cy="' + p[1] + '" r="11" stroke="#ff2e97" stroke-width="3.5" fill="#0b0716"/>';
          });
          document.getElementById("f01-world").innerHTML = s + "</g>";

          var LEN = Math.ceil(root.querySelector(".f01-old").getTotalLength()) + 2;
          var drawn = root.querySelectorAll(".f01-old, .f01-core"),
            fresh = root.querySelectorAll(".f01-fresh"),
            head = root.querySelectorAll(".f01-head");
          function setBeam(d) {
            K.dash(drawn, LEN, d, null);
            K.dash(fresh, LEN, d, 560);
            K.dash(head, LEN, d, 70);
          }

          // year chips: typed at 60 chars/s, year in ink, the rest ink-dim; caret blinks 3 times in eighths
          var CH = [
            { id: "f01-chip1", text: "2016 · ELECTRONICS & TELECOM", w: 552, at: F(45), type: F(48) },
            { id: "f01-chip2", text: "2019 · B.TECH, INFORMATION TECHNOLOGY", w: 699, at: F(90), type: F(93) },
          ];
          CH.forEach(function (c) {
            var el = document.getElementById(c.id);
            c.yr = el.querySelector(".f01-yr");
            c.rest = el.querySelector(".f01-rest");
            c.caret = el.querySelector(".f01-caret");
            c.end = c.type + c.text.length / 60;
          });
          function typeAt(c, t) {
            var n = Math.max(0, Math.min(c.text.length, Math.floor((t - c.type) * 60 + 1e-6)));
            c.yr.textContent = c.text.slice(0, Math.min(n, 4));
            c.rest.textContent = c.text.slice(4, Math.max(n, 4));
            var k = Math.floor((t - c.end) / 0.25 + 1e-6);
            c.caret.style.opacity = t < c.type ? 0 : t < c.end ? 1 : k < 6 && k % 2 === 0 ? 1 : 0;
          }

          var grain = document.getElementById("f01-grain");
          grain.style.backgroundImage = K.grainURL(1337);
          var axH = document.getElementById("f01-axh"),
            axV = document.getElementById("f01-axv");
          setBeam(0);

          var tl = gsap.timeline({ paused: true, defaults: { lazy: false } }); // no deferred first renders: any frame can be the first seek

          // master clock: beam head, typing, caret and grain are pure functions of local time
          var clock = { t: 0 };
          tl.to(clock, {
            t: 4,
            duration: 4,
            ease: "none",
            onUpdate: function () {
              setBeam(headAt(clock.t));
              CH.forEach(function (c) { typeAt(c, clock.t); });
              grain.style.backgroundPosition = K.grainPos(clock.t);
            },
          }, 0);
          tl.fromTo("#f01-haze", { opacity: 0.75 }, { opacity: 1, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

          // 0-12: CRT power-on from black. Dot (frame 0) -> line (scaleX) -> full tube (scaleY), white-hot flash
          tl.fromTo("#f01-tube", { scaleX: 0.02, scaleY: 0.006 }, { scaleX: 1, duration: 0.117, ease: "power4.out" }, F(1));
          tl.to("#f01-tube", { scaleY: 1, duration: 0.25, ease: "expo.out" }, F(4.5));
          tl.fromTo("#f01-flash", { opacity: 0.95 }, { opacity: 0, duration: 0.36, ease: "power2.out" }, F(4.5));
          tl.fromTo("#f01-scan", { opacity: 0.9 }, { opacity: 0, duration: 0.7, ease: "power2.in" }, F(4.5));

          // 12-30: the bench scope's graticule draws on: ticked axes open from the centre, divisions follow outward
          var ax = { k: 0 };
          tl.to(ax, {
            k: 1,
            duration: 0.42,
            ease: "power3.out",
            onUpdate: function () {
              axH.setAttribute("x", 960 - 960 * ax.k);
              axH.setAttribute("width", 1920 * ax.k);
              axV.setAttribute("y", 540 - 540 * ax.k);
              axV.setAttribute("height", 1080 * ax.k);
            },
          }, F(12));
          root.querySelectorAll(".f01-gl").forEach(function (ln) {
            tl.fromTo(ln, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, F(14) + 0.06 * Number(ln.getAttribute("data-r")));
          });

          // 30: a beam-core dot at the left edge starts routing; pads pop on 45/60/75/90 as the head reaches each bend
          tl.set("#f01-beam", { opacity: 1 }, F(30));
          tl.fromTo("#f01-spark", { opacity: 0, scale: 0, svgOrigin: "18.75 828" }, { opacity: 1, scale: 1, duration: 0.067, ease: "power4.out" }, F(30));
          tl.to("#f01-spark", { opacity: 0, scale: 0.4, duration: 0.3, ease: "power2.out" }, F(33));
          PADS.forEach(function (p, n) {
            tl.fromTo("#f01-pad" + n, { scale: 0, svgOrigin: p[0] + " " + p[1] }, { scale: 1, duration: 0.18, ease: "power4.out" }, F(45 + 15 * n));
          });

          // 45 and 90: a year chip condenses on the riser leaving the pad (Tier B entrance); the head passes through its cap
          var CHIP = K.spring(0.45, 0.8, 0.7);
          CH.forEach(function (c) {
            defs.insertAdjacentHTML("beforeend", K.lensFilter(c.id + "-f", { w: c.w, h: 76, r: 38, bezel: 32, dir: -1, power: 1.6 }));
            var fEl = document.getElementById(c.id + "-f"),
              g = { k: 0 };
            tl.fromTo("#" + c.id, { autoAlpha: 0, scale: 0.86 }, { autoAlpha: 1, scale: 1, duration: 0.7, ease: CHIP }, c.at);
            tl.to(g, { k: 1, duration: 0.7, ease: CHIP, onUpdate: function () { K.setRefraction(fEl, 44 * g.k); } }, c.at);
            tl.fromTo("#" + c.id + " .f01-rim", { "--spec": "60deg" }, { "--spec": "200deg", duration: 1.0, ease: "power3.out" }, c.at);
          });

          window.__timelines["f01"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
