<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/lib/reel-kit.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #0b0716;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0716;
      }
      [data-composition-id="root"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!--
      "The Line, in phosphor and glass": 52 s, 30 fps, 1920x1080. Twelve frames in film order
      (STORYBOARD.md: data-start = start frame / 30). Every frame's timeline is local to its slot.
      Sound is one pre-mixed track (music bed + all SFX), assets/audio/mix.wav, built by sound/mix.py.
    -->
    <div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-duration="52">
      <div
        id="f01"
        data-composition-id="f01"
        data-composition-src="compositions/01-origin.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="f02"
        data-composition-id="f02"
        data-composition-src="compositions/02-thesis.html"
        data-start="4"
        data-duration="4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="f03"

        data-composition-src="compositions/03-name.html"
        data-start="8"
        data-duration="4"

        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="f04"
        data-composition-id="f04"
        data-composition-src="compositions/04-fortmindz.html"
        data-start="12"
        data-duration="4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="f05"
        data-composition-id="f05"
        data-composition-src="compositions/05-impero.html"
        data-start="16"
        data-duration="4"
        data-track-index="1"

        data-height="1080"
      ></div>
      <div
        id="f06"
        data-composition-id="f06"
        data-composition-src="compositions/06-enterprise.html"
        data-start="20"
        data-duration="6"
        data-track-index="1"

        data-height="1080"
      ></div>
      <div

        data-start="0"
        data-duration="52"
        data-track-index="2"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines["root"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
