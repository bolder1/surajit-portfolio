<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/lib/reel-kit.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #0b0716;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0716;
      }
      [data-composition-id="root"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Review host. Right now it mounts only the 4 s style frame (compositions/00-styleframe.html)
      so `npx hyperframes snapshot / check / preview` can reach it. During assembly, replace this
      slot with the twelve frame slots from STORYBOARD.md (root data-duration becomes 52).
    -->
    <div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-duration="4">
      <div
        id="el-styleframe"
        data-composition-id="styleframe"
        data-composition-src="compositions/00-styleframe.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["root"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
